      for (let i = 0; i < 40; i++) { c.fillStyle = r() < 0.5 ? '#2a1a16' : '#120a08'; c.beginPath(); c.ellipse(r() * w, 5 + r() * (h - 6), 2 + r() * 6, 1 + r() * 2, 0, 0, TAU); c.fill(); }
    });
    L.cracks = makeLayer(512, 66, rs, (c, w, h) => {
      c.strokeStyle = '#ff6a1a'; c.lineCap = 'round';
      for (let i = 0; i < 9; i++) {
        let x = r() * w, y = 3 + r() * 30;
        c.lineWidth = 1 + r() * 1.5;
        c.beginPath(); c.moveTo(x, y);
        for (let k = 0; k < 6; k++) { x += 6 + r() * 12; y += (r() - 0.4) * 8; c.lineTo(x, Math.max(2, y)); }
        c.stroke();
      }
      c.globalCompositeOperation = 'lighter';
      c.filter = 'blur(3px)'; c.globalAlpha = 0.8;
      c.drawImage(c.canvas, 0, 0, c.canvas.width, c.canvas.height, 0, 0, w, h);
      c.filter = 'none'; c.globalAlpha = 1;
    });
  }
  return L;
}

function ensureLayers(theme) {
  const rs = Layout.dpr * Layout.game.s;
  const key = theme + '|' + rs.toFixed(2);
  if (R.key !== key) { R.layers = buildLayers(theme, rs); R.key = key; }
  if (R.wTheme !== theme) initWeather(theme);
}

function drawTiled(c, L, camX, par, y, alpha) {
  if (!L) return;
  const off = -(((camX * par) % L.w) + L.w) % L.w;
  if (alpha != null) c.globalAlpha = alpha;
  for (let x = off; x < Layout.VW + 1; x += L.w) c.drawImage(L.cv, x, y, L.w + 0.5, L.h);
  c.globalAlpha = 1;
}

/* ---------- Clima ---------- */
function initWeather(theme) {
  R.wTheme = theme; R.weather = [];
  const kind = THEMES[theme].weather, n = kind === 'rain' ? 90 : kind === 'ash' ? 70 : 45;
  for (let i = 0; i < n; i++) R.weather.push({ x: rand(0, 820), y: rand(0, 360), s: rand(0.5, 1), p: rand(0, TAU) });
}
function drawWeather(c, theme, dt) {
  const kind = THEMES[theme].weather, VW = Layout.VW;
  if (kind === 'rain') {
    c.strokeStyle = 'rgba(170,190,210,0.28)'; c.lineWidth = 1;
    c.beginPath();
    for (const p of R.weather) {
      p.y += 560 * p.s * dt; p.x -= 150 * p.s * dt;
      if (p.y > 360) { p.y = -10; p.x = rand(0, VW + 100); }
      if (p.x < -20) p.x += VW + 60;
      c.moveTo(p.x, p.y); c.lineTo(p.x + 4 * p.s, p.y - 15 * p.s);
    }
    c.stroke();
  } else if (kind === 'embers') {
    c.globalCompositeOperation = 'lighter';
    for (const p of R.weather) {
      p.y -= 26 * p.s * dt; p.p += dt * 2; p.x += Math.sin(p.p) * 12 * dt;
      if (p.y < -10) { p.y = 370; p.x = rand(0, VW); }
      FX.drawGlow(c, 'orange', p.x, p.y, 4 * p.s, 0.5 + Math.sin(p.p * 3) * 0.3);
    }
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  } else {
    for (const p of R.weather) {
      p.y += 22 * p.s * dt; p.p += dt * 1.5; p.x += Math.sin(p.p) * 14 * dt - 6 * dt;
      if (p.y > 365) { p.y = -5; p.x = rand(0, VW); }
      if (p.x < -5) p.x = VW + 5;
      c.fillStyle = p.s > 0.9 ? 'rgba(255,120,40,0.8)' : 'rgba(110,100,95,0.55)';
      c.fillRect(p.x, p.y, 1.6 * p.s + 0.4, 1.6 * p.s + 0.4);
    }
  }
}

/* ---------- Cielo y escenario ---------- */
function drawSky(c, W, dt) {
  const T = THEMES[W.theme], VW = Layout.VW;
  const g = c.createLinearGradient(0, 0, 0, GY);
  g.addColorStop(0, T.sky[0]); g.addColorStop(0.5, T.sky[1]); g.addColorStop(0.76, T.sky[2]); g.addColorStop(0.86, T.sky[3]);
  c.fillStyle = g; c.fillRect(0, 0, VW, 360);
  const sx = VW * T.sun[0] - W.cam.x * 0.02;
  c.globalCompositeOperation = 'lighter';
  glowBlob(c, sx, T.sun[1], 150, T.sun[2], 0.35);
  if (W.theme === 'templo') { c.fillStyle = 'rgba(255,200,140,0.25)'; c.beginPath(); c.arc(sx, T.sun[1], 26, 0, TAU); c.fill(); }
  c.globalCompositeOperation = 'source-over';
  // relámpagos en la costa
  if (W.theme === 'costa') {
    R.nextBolt -= dt;
    if (R.nextBolt <= 0) { R.bolt = 0.22; R.boltX = rand(40, VW - 40); R.nextBolt = rand(5, 11); setTimeout(() => Sfx.play('boom', 0.35), 350); }
    if (R.bolt > 0) {
      R.bolt -= dt;
      c.fillStyle = `rgba(200,215,255,${R.bolt * 1.4})`; c.fillRect(0, 0, VW, 360);
      c.strokeStyle = 'rgba(235,240,255,0.9)'; c.lineWidth = 1.6;
      const r = rng(Math.floor(R.boltX));
      c.beginPath(); let x = R.boltX, y = 0; c.moveTo(x, y);
      while (y < 210) { x += (r() - 0.5) * 30; y += 14 + r() * 14; c.lineTo(x, y); }
      c.stroke();
    }
  }
  const L = R.layers;
  drawTiled(c, L.far, W.cam.x, 0.12, L.farY);
  // brillo del mar
  if (W.theme === 'costa') {
    c.fillStyle = 'rgba(200,120,80,0.18)';
    const t = performance.now() / 1000;
    for (let i = 0; i < 12; i++) { const x = ((i * 97 + t * 8 - W.cam.x * 0.12) % (VW + 40) + VW + 40) % (VW + 40) - 20; c.fillRect(x, 238 + (i % 5) * 9, 14 + (i % 3) * 6, 1); }
  }
  // niebla entre capas
  const fg = c.createLinearGradient(0, 200, 0, GY);
  fg.addColorStop(0, `rgba(${T.fog},0)`); fg.addColorStop(1, `rgba(${T.fog},0.45)`);
  c.fillStyle = fg; c.fillRect(0, 200, VW, GY - 200);
  drawTiled(c, L.mid, W.cam.x, 0.42, L.midY);
  if (W.theme === 'volcan') {
    c.globalCompositeOperation = 'lighter';
    const p = 0.25 + Math.sin(performance.now() / 600) * 0.08;
    const lg = c.createLinearGradient(0, 230, 0, GY);
    lg.addColorStop(0, 'rgba(255,70,10,0)'); lg.addColorStop(1, `rgba(255,70,10,${p})`);
    c.fillStyle = lg; c.fillRect(0, 230, VW, GY - 230);
    c.globalCompositeOperation = 'source-over';
  }
}

function drawGround(c, W) {
  const L = R.layers;
  drawTiled(c, L.ground, W.cam.x, 1, GY - 6);
  if (L.cracks) {
    c.globalCompositeOperation = 'lighter';
    drawTiled(c, L.cracks, W.cam.x, 1, GY - 6, 0.55 + Math.sin(performance.now() / 500) * 0.25);
    c.globalCompositeOperation = 'source-over';
  }
}

function drawProps(c, W) {
  if (W.theme !== 'templo') return;
  const t = performance.now() / 1000;
  const x0 = Math.floor((W.cam.x - 100) / 420) * 420 + 260;
  for (let x = x0; x < W.cam.x + Layout.VW + 100; x += 420) {
    c.strokeStyle = '#3a2614'; c.lineWidth = 2.5; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x - 9, GY - 2); c.lineTo(x, GY - 36); c.lineTo(x + 9, GY - 2); c.moveTo(x, GY - 36); c.lineTo(x, GY - 4); c.stroke();
    c.fillStyle = '#7a5428'; c.beginPath(); c.moveTo(x - 13, GY - 40); c.lineTo(x + 13, GY - 40); c.lineTo(x + 8, GY - 33); c.lineTo(x - 8, GY - 33); c.fill();
    c.globalCompositeOperation = 'lighter';
    FX.drawGlow(c, 'orange', x, GY - 44, 46, 0.45 + Math.sin(t * 9 + x) * 0.08);
    for (let k = 0; k < 4; k++) FX.drawGlow(c, k < 2 ? 'orange' : 'gold', x + Math.sin(t * 7 + k * 2 + x) * 3, GY - 46 - k * 4 - Math.abs(Math.sin(t * 5 + k)) * 4, 9 - k, 0.85);
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    if (chance(0.06)) FX.embers(x, GY - 52, 1, 'orange', 4);
  }
}

function drawBarrier(c, W) {
  if (!W.locked) return;
  const t = performance.now() / 1000;
  for (const [x, dir] of [[W.bounds.l, 1], [W.bounds.r, -1]]) {
    c.fillStyle = 'rgba(0,0,0,0.45)';
    if (dir > 0) c.fillRect(x - 900, 0, 900, 360); else c.fillRect(x, 0, 900, 360);
    const g = c.createLinearGradient(x - 10, 0, x + 10, 0);
    const a = 0.45 + Math.sin(t * 6) * 0.15;
    g.addColorStop(0, 'rgba(255,60,20,0)'); g.addColorStop(0.5, `rgba(255,90,30,${a})`); g.addColorStop(1, 'rgba(255,60,20,0)');
    c.fillStyle = g; c.fillRect(x - 10, GY - 190, 20, 190);
    c.fillStyle = `rgba(255,190,120,${a})`;
    for (let i = 0; i < 6; i++) {
      const y = GY - 20 - ((t * 30 + i * 32) % 180);
      c.fillRect(x - 2, y, 4, 7); c.fillRect(x - 4, y + 2, 8, 1.5);
    }
  }
}

function drawOrbs(c, W) {
  c.globalCompositeOperation = 'lighter';
  for (const o of W.orbs) {
    const col = o.k === 'red' ? 'red' : o.k === 'green' ? 'green' : 'gold';
    FX.drawGlow(c, col, o.x, o.y, 9, 0.9);
    FX.drawGlow(c, 'white', o.x, o.y, 3, 0.9);
  }
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
}

function drawProjs(c, W) {
  for (const p of W.projs) {
    if (p.k === 'arrow') {
      const a = Math.atan2(p.vy, p.vx);
      c.save(); c.translate(p.x, p.y); c.rotate(a);
      c.strokeStyle = '#6a4a2a'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(-12, 0); c.lineTo(4, 0); c.stroke();
      c.fillStyle = '#c8c0b0'; c.beginPath(); c.moveTo(4, -2); c.lineTo(8, 0); c.lineTo(4, 2); c.fill();
      c.fillStyle = '#9c1b17'; c.fillRect(-12, -2, 3, 4);
      c.restore();
    } else if (p.k === 'rock') {
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot || 0);
      c.fillStyle = '#4a3b30'; c.beginPath();
      for (let i = 0; i < 7; i++) { const a = i / 7 * TAU, rr = 15 + (i % 3) * 3; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      c.fill(); c.fillStyle = '#5e4c3e'; c.beginPath(); c.arc(-4, -4, 6, 0, TAU); c.fill();
      c.restore();
      c.fillStyle = 'rgba(0,0,0,0.3)'; c.beginPath(); c.ellipse(p.x, GY + 1, 14, 3, 0, 0, TAU); c.fill();
    } else if (p.k === 'wave') {
      c.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 3; i++) FX.drawGlow(c, 'orange', p.x - Math.sign(p.vx) * i * 8, GY - 8 - i * 3, 16 - i * 3, 0.7);
      c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
      c.strokeStyle = 'rgba(255,200,140,0.8)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(p.x - 10, GY); c.quadraticCurveTo(p.x + Math.sign(p.vx) * 4, GY - p.hgt, p.x + Math.sign(p.vx) * 10, GY); c.stroke();
    }
  }
}

function drawWorld(c, W, dt) {
  const VW = Layout.VW;
  drawSky(c, W, dt);
  drawGround(c, W);
  const [sx, sy] = FX.shakeOffset();
  c.save();
  const z = W.zoomCur;
  if (z !== 1) {
    const fx = clamp(W.hero.x - W.cam.x, VW * 0.2, VW * 0.8), fy = W.hero.y - 40;
    c.translate(fx, fy); c.scale(z, z); c.translate(-fx, -fy);
  }
  c.translate(-W.cam.x + sx, sy);
  drawProps(c, W);
  FX.drawDecals(c);
  drawBarrier(c, W);
  // sombras
  c.fillStyle = 'rgba(0,0,0,0.35)';
  const hh = W.hero, hs = Math.max(0.3, 1 - (GY - hh.y) / 200);
  c.beginPath(); c.ellipse(hh.x, GY + 1, 13 * hs, 3 * hs, 0, 0, TAU); c.fill();
  for (const e of W.enemies) if (e.state !== 'spawn') enemyGround(c, e);
  drawOrbs(c, W);
  const list = W.enemies.slice().sort((a, b) => (b.T.boss ? 1 : 0) - (a.T.boss ? 1 : 0) || (a.dead ? 0 : 1) - (b.dead ? 0 : 1));
  for (const e of list) drawEnemy(c, e);
  if (!W.hideHero) drawHero(c, W.hero);
  drawProjs(c, W);
  FX.drawTrails(c);
  FX.draw(c);
  c.restore();
  drawWeather(c, W.theme, dt);
  // viñeta y tintes
  const h = W.hero;
  const vg = c.createRadialGradient(VW / 2, 190, 120, VW / 2, 190, VW * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  c.fillStyle = vg; c.fillRect(0, 0, VW, 360);
  if (W.mode !== 'menu') {
    if (h.rageT > 0) { c.fillStyle = `rgba(255,70,10,${0.08 + Math.sin(performance.now() / 120) * 0.03})`; c.fillRect(0, 0, VW, 360); }
    if (h.hp > 0 && h.hp < h.hpMax * 0.25) {
      const lg = c.createRadialGradient(VW / 2, 180, 100, VW / 2, 180, VW * 0.65);
      lg.addColorStop(0, 'rgba(120,0,0,0)'); lg.addColorStop(1, `rgba(150,0,0,${0.35 + Math.sin(performance.now() / 180) * 0.15})`);
      c.fillStyle = lg; c.fillRect(0, 0, VW, 360);
    }
  }
  if (FX.flash > 0) { c.fillStyle = `rgba(${FX.flashCol},${FX.flash * 0.6})`; c.fillRect(0, 0, VW, 360); }
}

/* ---------- HUD ---------- */
const FONT = (w, s) => `${w} ${s}px Cinzel, "Trajan Pro", Georgia, serif`;
function txt(c, s, x, y, size, col, align = 'left', w = 700, stroke = true) {
  c.font = FONT(w, size); c.textAlign = align; c.textBaseline = 'middle';
  if (stroke) { c.lineWidth = 3; c.strokeStyle = 'rgba(8,3,2,0.85)'; c.lineJoin = 'round'; c.strokeText(s, x, y); }
  c.fillStyle = col; c.fillText(s, x, y);
}
function frameBar(c, x, y, w, h) {
  c.fillStyle = 'rgba(10,5,4,0.75)'; c.fillRect(x - 2, y - 2, w + 4, h + 4);
  c.strokeStyle = '#9b7a3c'; c.lineWidth = 1; c.strokeRect(x - 1.5, y - 1.5, w + 3, h + 3);
  c.fillStyle = '#9b7a3c'; c.fillRect(x - 4, y + h / 2 - 1.5, 3, 3); c.fillRect(x + w + 1, y + h / 2 - 1.5, 3, 3);
}

function drawHUD(c, W, dt) {
  const L = Layout, h = W.hero, s = L.game.s, VW = L.VW;
  const sl = (L.portrait ? 0 : L.safe.l / s) + 12, sr = (L.portrait ? 0 : L.safe.r / s) + 12;
  const st = (L.portrait ? 0 : L.safe.t / s) + 10;
  // vida
  const bw = 110 + (h.hpMax - 100) * 0.45, bh = 8;
  frameBar(c, sl, st, bw, bh);
  c.fillStyle = '#e9d48a'; c.fillRect(sl, st, bw * h.hpLag / h.hpMax, bh);
  const hg = c.createLinearGradient(0, st, 0, st + bh);
  hg.addColorStop(0, '#6fd36a'); hg.addColorStop(1, '#22792c');
  c.fillStyle = hg; c.fillRect(sl, st, bw * h.hp / h.hpMax, bh);
  // ira
  const rw = 92 + (h.rageMax - 8) * 2.5, ry = st + 13;
  frameBar(c, sl, ry, rw, 5);
  const full = h.rage >= 100 && h.rageT <= 0;
  const rg = c.createLinearGradient(sl, 0, sl + rw, 0);
  rg.addColorStop(0, '#8e1a0c'); rg.addColorStop(1, h.rageT > 0 ? '#ffe08a' : '#ff7a22');
  c.fillStyle = rg; c.fillRect(sl, ry, rw * h.rage / 100, 5);
  if (full) {
    c.globalCompositeOperation = 'lighter';
    FX.drawGlow(c, 'orange', sl + rw, ry + 2.5, 14 + Math.sin(performance.now() / 120) * 3, 0.8);
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    txt(c, 'IRA LISTA', sl + rw + 10, ry + 2.5, 7, '#ffcf6a');
  }
  // orbes rojos
  c.globalCompositeOperation = 'lighter';
  FX.drawGlow(c, 'red', sl + 4, st + 31, 9, 1); FX.drawGlow(c, 'white', sl + 4, st + 31, 3, 0.9);
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  txt(c, String(Math.floor(Game.save.orbs)), sl + 13, st + 31.5, 10, '#f2d9c4');
  // oleadas
  if (W.mode === 'arena') txt(c, `OLEADA ${W.arenaN}`, VW / 2, st + 4, 9, '#e8d3a6', 'center');
  else if (W.locked && W.waves && !W.boss) txt(c, `OLEADA ${Math.min(W.waveIdx + 1, W.waves.length)} / ${W.waves.length}`, VW / 2, st + 4, 9, '#e8d3a6', 'center');
  // combo
  if (h.combo >= 3) {
    const k = clamp(h.comboT / 2.4, 0, 1);
    c.globalAlpha = clamp(k * 3, 0, 1);
    const pop = 1 + Math.max(0, (h.comboT - 2.25)) * 3;
    txt(c, String(h.combo), VW - sr - 8, st + 44, Math.round(22 * pop), h.combo >= 30 ? '#ffcf4a' : '#f2e4c8', 'right');
    txt(c, 'GOLPES', VW - sr - 8, st + 62, 8, '#c9a46a', 'right');
    c.globalAlpha = 1;
  }
  // avanzar
  if (!W.locked && W.mode === 'story' && !W.boss && W.encIdx < W.encounters.length && h.state !== 'dead') {
    const a = 0.5 + Math.sin(performance.now() / 200) * 0.4;
    c.globalAlpha = a;
    txt(c, '›››', VW - sr - 4, 190, 22, '#ffcf8a', 'right');
    c.globalAlpha = 1;
  }
  // barra del jefe
  const b = W.boss;
  if (b && b.alive && b.state !== 'intro') {
    const w = Math.min(380, VW * 0.6), x = VW / 2 - w / 2, y = 340;
    frameBar(c, x, y, w, 7);
    c.fillStyle = '#7a0d0a'; c.fillRect(x, y, w * Math.max(0, b.hp) / b.hpMax, 7);
    c.fillStyle = '#d43a22'; c.fillRect(x, y, w * Math.max(0, b.hp) / b.hpMax, 3);
    txt(c, 'POLIFEMO', VW / 2, y - 9, 9, '#f0d9b0', 'center');
  }
  if (b && b.state === 'intro' && b.onGround && b.t > 0.6) {
    const a = clamp((b.t - 0.6) * 3, 0, 1) * clamp((2.3 - b.t) * 3, 0, 1);
    c.globalAlpha = a;
    txt(c, 'POLIFEMO', VW / 2, 120, 34, '#f4e2bf', 'center', 900);
    txt(c, 'EL CÍCLOPE TITÁN', VW / 2, 148, 11, '#d49a5a', 'center');
    c.globalAlpha = 1;
  }
  // aviso
  if (W.toast) {
    const tt = W.toast;
    tt.t += dt;
    const a = clamp(tt.t * 4, 0, 1) * clamp((tt.dur - tt.t) * 3, 0, 1);
    if (a > 0) {
      c.globalAlpha = a;
      c.font = FONT(700, 9);
      const lines = tt.text.split('\n');
      const tw = Math.max(...lines.map(l => c.measureText(l).width)) + 24, th = lines.length * 13 + 10;
      const x = VW / 2 - tw / 2, y = st + 16;
      c.fillStyle = 'rgba(14,7,5,0.82)'; c.fillRect(x, y, tw, th);
      c.strokeStyle = 'rgba(200,160,90,0.6)'; c.lineWidth = 1; c.strokeRect(x + 0.5, y + 0.5, tw - 1, th - 1);
      lines.forEach((l, i) => txt(c, l, VW / 2, y + 11 + i * 13, 9, '#f2e4c8', 'center', 700, false));
      c.globalAlpha = 1;
    }
    if (tt.t > tt.dur) W.toast = null;
  }
  // rótulo de capítulo
  if (W.title && W.title.t < W.title.dur) {
    const T = W.title; T.t += dt;
    const a = clamp(T.t * 2, 0, 1) * clamp((T.dur - T.t) * 1.5, 0, 1);
    c.globalAlpha = a;
    const g = c.createLinearGradient(0, 120, 0, 230);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.3, 'rgba(0,0,0,0.65)'); g.addColorStop(0.7, 'rgba(0,0,0,0.65)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(0, 120, VW, 110);
    txt(c, T.small, VW / 2, 146, 10, '#c9a46a', 'center');
    txt(c, T.big, VW / 2, 172, 24, '#f4e6c8', 'center', 900);
    if (T.sub) txt(c, T.sub, VW / 2, 198, 9, '#bfae95', 'center', 400);
    c.globalAlpha = 1;
  }
  // QTE contra Polifemo
  if (W.qte) {
    const q = W.qte, pulse = 1 + Math.sin(performance.now() / 70) * 0.08;
    c.fillStyle = 'rgba(0,0,0,0.35)'; c.fillRect(0, 0, VW, 360);
    const cx = VW / 2, cy = 150;
    c.globalCompositeOperation = 'lighter';
    FX.drawGlow(c, 'red', cx, cy, 50 * pulse, 0.8);
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    c.strokeStyle = 'rgba(60,10,8,0.9)'; c.lineWidth = 7; c.beginPath(); c.arc(cx, cy, 30, 0, TAU); c.stroke();
    c.strokeStyle = '#ffcf6a'; c.lineWidth = 7; c.beginPath(); c.arc(cx, cy, 30, -Math.PI / 2, -Math.PI / 2 + TAU * q.prog); c.stroke();
    c.strokeStyle = '#ff5544'; c.lineWidth = 4; c.beginPath(); c.arc(cx, cy, 15 * pulse, 0, TAU); c.stroke();
    txt(c, Input.touchMode ? '¡PULSA ○ SIN PARAR!' : '¡PULSA L / ○ SIN PARAR!', cx, cy + 50, 13, '#fff0d0', 'center', 900);
    c.fillStyle = 'rgba(255,220,160,0.8)'; c.fillRect(cx - 60, cy + 64, 120 * clamp(1 - q.t / q.dur, 0, 1), 2);
  }
}

/* ---------- Controles táctiles ---------- */
const BTN_COL = { light: '#f08fb0', heavy: '#6fd6b0', dodge: '#f0644e', jump: '#78aef0', rage: '#ff8a2a', pause: '#e8d3a6' };

function drawSymbol(c, id, x, y, r, col) {
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = Math.max(2, r * 0.13); c.lineJoin = 'round'; c.lineCap = 'round';
  const k = r * 0.42;
  c.beginPath();
  if (id === 'light') c.rect(x - k * 0.8, y - k * 0.8, k * 1.6, k * 1.6);
  else if (id === 'heavy') { c.moveTo(x, y - k); c.lineTo(x + k * 0.95, y + k * 0.7); c.lineTo(x - k * 0.95, y + k * 0.7); c.closePath(); }
  else if (id === 'dodge') c.arc(x, y, k * 0.9, 0, TAU);
  else if (id === 'jump') { c.moveTo(x - k * 0.8, y - k * 0.8); c.lineTo(x + k * 0.8, y + k * 0.8); c.moveTo(x + k * 0.8, y - k * 0.8); c.lineTo(x - k * 0.8, y + k * 0.8); }
  else if (id === 'pause') { c.fillRect(x - k * 0.55, y - k * 0.7, k * 0.38, k * 1.4); c.fillRect(x + k * 0.17, y - k * 0.7, k * 0.38, k * 1.4); return; }
  else if (id === 'rage') {
    c.moveTo(x, y - k * 1.1);
    c.quadraticCurveTo(x + k * 1.1, y - k * 0.1, x + k * 0.5, y + k * 0.9);
    c.quadraticCurveTo(x, y + k * 1.1, x - k * 0.5, y + k * 0.9);
    c.quadraticCurveTo(x - k * 1.1, y - k * 0.1, x, y - k * 1.1);
    c.fill(); return;
  }
  c.stroke();
}

function drawControls(c, W) {
  const L = Layout, u = L.ui;
  const h = W.hero;
  if (L.portrait && Input.touchMode) {
    const top = L.game.y + L.game.h;
    const g = c.createLinearGradient(0, top, 0, L.H);
    g.addColorStop(0, '#1a0d09'); g.addColorStop(1, '#0b0605');
    c.fillStyle = g; c.fillRect(0, top, L.W, L.H - top);
    // greca (meandro griego)
    c.strokeStyle = 'rgba(176,132,60,0.55)'; c.lineWidth = 1.5;
    c.beginPath();
    for (let x = 0; x < L.W; x += 16) { const y = top + 6; c.moveTo(x, y + 6); c.lineTo(x, y); c.lineTo(x + 12, y); c.lineTo(x + 12, y + 6); c.lineTo(x + 5, y + 6); c.lineTo(x + 5, y + 3); }
    c.stroke();
  }
  const finishReady = W.qte || (h && h.state !== 'dead' && findFinishTarget(h, W));
  for (const b of Input.buttons) {
    if (!Input.visibleButton(b)) continue;
    const down = Input.isDown(b.id);
    const col = BTN_COL[b.id];
    let r = b.r * (down ? 0.92 : 1);
    if (b.id === 'rage') {
      const ready = h.rage >= 100 && h.rageT <= 0;
      c.fillStyle = 'rgba(16,8,6,0.5)'; c.beginPath(); c.arc(b.x, b.y, r, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(255,140,60,0.25)'; c.lineWidth = 3; c.beginPath(); c.arc(b.x, b.y, r - 2, 0, TAU); c.stroke();
      c.strokeStyle = h.rageT > 0 ? '#ffe08a' : '#ff7a22'; c.lineWidth = 3;
      c.beginPath(); c.arc(b.x, b.y, r - 2, -Math.PI / 2, -Math.PI / 2 + TAU * h.rage / 100); c.stroke();
      if (ready) { c.globalCompositeOperation = 'lighter'; FX.drawGlow(c, 'orange', b.x, b.y, r * 1.8 + Math.sin(performance.now() / 110) * 4, 0.7); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; }
      drawSymbol(c, 'rage', b.x, b.y, r, ready || h.rageT > 0 ? '#ffb347' : 'rgba(255,160,90,0.35)');
      continue;
    }
    if (b.id === 'dodge' && finishReady) {
      c.globalCompositeOperation = 'lighter';
      FX.drawGlow(c, 'red', b.x, b.y, r * 1.9 + Math.sin(performance.now() / 80) * 5, 0.8);
      c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    }
    c.fillStyle = down ? 'rgba(60,30,20,0.55)' : 'rgba(16,8,6,0.3)';
    c.beginPath(); c.arc(b.x, b.y, r, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(232,211,166,0.25)'; c.lineWidth = 1.5; c.stroke();
    c.globalAlpha = down ? 1 : 0.85;
    drawSymbol(c, b.id, b.x, b.y, r, down ? '#fff' : col);
    c.globalAlpha = 1;
    if (b.label && L.ui > 0.85) {
      c.font = `600 ${Math.round(9 * u)}px Cinzel, Georgia, serif`; c.textAlign = 'center'; c.textBaseline = 'top';
      c.fillStyle = 'rgba(232,211,166,0.45)';
      c.fillText(b.id === 'dodge' && finishReady ? 'Rematar' : b.label, b.x, b.y + r + 2);
    }
  }
  if (Input.touchMode) {
    const s = Input.stick, home = L.stickHome, R0 = L.stickR;
    const ox = s ? s.ox : home.x, oy = s ? s.oy : home.y;
    c.fillStyle = 'rgba(16,8,6,0.35)'; c.beginPath(); c.arc(ox, oy, R0, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(232,211,166,0.25)'; c.lineWidth = 1.5; c.stroke();
    c.fillStyle = 'rgba(232,211,166,0.3)';
    c.beginPath(); c.moveTo(ox - R0 + 8, oy); c.lineTo(ox - R0 + 16, oy - 6); c.lineTo(ox - R0 + 16, oy + 6); c.fill();
    c.beginPath(); c.moveTo(ox + R0 - 8, oy); c.lineTo(ox + R0 - 16, oy - 6); c.lineTo(ox + R0 - 16, oy + 6); c.fill();
    let kx = ox, ky = oy;
    if (s) { const dx = s.x - s.ox, dy = s.y - s.oy, d = Math.hypot(dx, dy), m = Math.min(d, R0); if (d > 0) { kx = ox + dx / d * m; ky = oy + dy / d * m; } }
    c.fillStyle = s ? 'rgba(232,211,166,0.45)' : 'rgba(232,211,166,0.22)';
    c.beginPath(); c.arc(kx, ky, R0 * 0.42, 0, TAU); c.fill();
  }
}

/* ---------- Fotograma ---------- */
function render(dt) {
  const L = Layout, c = R.c, W = Game.world;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = '#0b0605'; c.fillRect(0, 0, R.cv.width, R.cv.height);
  if (!W) return;
  ensureLayers(W.theme);
  const s = L.game.s * L.dpr;
  c.setTransform(s, 0, 0, s, L.game.x * L.dpr, L.game.y * L.dpr);
  c.save();
  c.beginPath(); c.rect(0, 0, L.VW, 360); c.clip();
  drawWorld(c, W, dt);
  if (W.mode !== 'menu') drawHUD(c, W, dt);
  c.restore();
  if (W.mode !== 'menu' && Game.state === 'playing') {
    c.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
    drawControls(c, W);
  }
}

  },
  toggles() {
    return ['music:Música', 'sfx:Efectos', 'vib:Vibración'].map(s => { const [k, l] = s.split(':'); return `<button class="tog" data-tog="${k}" aria-pressed="true">${l}</button>`; }).join('');
  },

  show(id, data) {
    this.cur = id; this.data = data || null;
    for (const s of this.root.querySelectorAll('.scr')) s.classList.toggle('on', s.id === 's-' + id);
    this.refresh();
    const el = document.getElementById('s-' + id);
    if (el) el.scrollTop = 0;
    if (!Input.touchMode) {
      const first = el && el.querySelector('button.primary:not([hidden]):not([disabled]), button:not([hidden]):not([disabled])');
      if (first) try { first.focus({ preventScroll: true }); } catch (e) { first.focus(); }
    }
  },
  hide() {
    this.cur = null;
    for (const s of this.root.querySelectorAll('.scr')) s.classList.remove('on');
    try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch (e) { /* nada */ }
  },

  refresh() {
    const S = Game.save;
    for (const b of this.root.querySelectorAll('[data-tog]')) {
      const on = !!Game.settings[b.dataset.tog];
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    for (const b of this.root.querySelectorAll('[data-diff]')) {
      const on = +b.dataset.diff === Game.diffIdx;
      b.classList.toggle('on', on); b.setAttribute('aria-checked', on ? 'true' : 'false');
    }
    if (this.cur === 'menu') {
      const cont = document.getElementById('b-continue');
      const can = S.chapter > 0 && S.chapter < CHAPTERS.length;
      cont.hidden = !can;
      document.getElementById('b-new').classList.toggle('primary', !can);
      if (can) document.getElementById('b-continue-sub').textContent = 'Capítulo ' + ROMAN[S.chapter + 1];
      document.getElementById('b-arena-sub').textContent = S.best > 0 ? 'Récord: oleada ' + S.best : 'Supervivencia';
      document.getElementById('b-altar-sub').textContent = Math.floor(S.orbs) + ' orbes';
    }
    if (this.cur === 'pause') {
      document.getElementById('b-restart').textContent = Game.world && Game.world.mode === 'arena' ? 'Reiniciar desde la oleada 1' : 'Reiniciar desde el último punto';
    }
    if (this.cur === 'over') {
      const W = Game.world, arena = W && W.mode === 'arena';
      document.getElementById('over-sub').textContent = arena
        ? `Has resistido ${Math.max(0, W.arenaN - 1)} oleadas. Récord: ${S.best}.`
        : pick(['Esparta no perdona la derrota. Levántate.', 'Las Moiras aún no han cortado tu hilo.', 'Caronte tendrá que esperar.']);
      document.getElementById('b-retry').textContent = arena ? 'Otra vez' : 'Reintentar';
      document.getElementById('b-altar-over-sub').textContent = Math.floor(S.orbs) + ' orbes';
    }
    if (this.cur === 'upgrade') this.renderUpgrades();
    if (this.cur === 'win') {
      const st = Game.stats, m = Math.floor(st.time / 60), s = Math.floor(st.time % 60);
      document.getElementById('win-stats').innerHTML =
        `<div><dt>Tiempo</dt><dd>${m}:${String(s).padStart(2, '0')}</dd></div>` +
        `<div><dt>Enemigos abatidos</dt><dd>${st.kills}</dd></div>` +
        `<div><dt>Combo máximo</dt><dd>${st.maxCombo}</dd></div>` +
        `<div><dt>Orbes reunidos</dt><dd>${Math.floor(st.orbs)}</dd></div>` +
        `<div><dt>Dificultad</dt><dd>${Game.diff.name}</dd></div>`;
    }
  },

  renderUpgrades() {
    const S = Game.save;
    document.getElementById('up-orbs').textContent = Math.floor(S.orbs);
    document.getElementById('ups').innerHTML = UPGRADES.map(u => {
      const lvl = S.up[u.id], max = lvl >= u.max, cost = max ? 0 : u.cost[lvl];
      const pips = Array.from({ length: u.max }, (_, i) => `<i class="${i < lvl ? 'full' : ''}"></i>`).join('');
      return `<article class="up">
        <div class="up-top"><span class="ico">${ICONS[u.icon]}</span><div><h3>${u.name}</h3><p>${u.desc}</p></div></div>
        <div class="pips" aria-label="Nivel ${lvl} de ${u.max}">${pips}</div>
        <p class="stat">${u.stat(lvl)}${max ? '' : ' <span>→ ' + u.stat(lvl + 1) + '</span>'}</p>
        <button class="btn small${!max && S.orbs >= cost ? ' primary' : ''}" data-up="${u.id}" ${max || S.orbs < cost ? 'disabled' : ''}>${max ? 'Nivel máximo' : `Mejorar <small>${cost} orbes</small>`}</button>
      </article>`;
    }).join('');
    const btn = document.getElementById('up-continue');
    const d = this.data || {};
    btn.textContent = d.next != null ? (d.next < CHAPTERS.length ? 'Continuar al Capítulo ' + ROMAN[d.next + 1] : 'Continuar') : 'Volver';
  },

  onButton(b) {
    if (b.dataset.tog) {
      const k = b.dataset.tog;
      Game.settings[k] = !Game.settings[k];
      if (k === 'music') Sfx.setMusic(Game.settings.music);
      if (k === 'sfx') Sfx.setSfx(Game.settings.sfx);
      if (k === 'vib' && Game.settings.vib) vibrate(40);
      Game.saveSettings(); Sfx.play('ui'); this.refresh();
      return;
    }
    if (b.dataset.diff) { Game.setDiff(+b.dataset.diff); Sfx.play('ui'); this.refresh(); return; }
    if (b.dataset.up) {
      const u = UPGRADES.find(x => x.id === b.dataset.up), S = Game.save, lvl = S.up[u.id];
      if (lvl >= u.max || S.orbs < u.cost[lvl]) return;
      S.orbs -= u.cost[lvl]; S.up[u.id] = lvl + 1; Game.persist();
      Sfx.play('upgrade'); vibrate(30);
      this.renderUpgrades();
      const nb = this.root.querySelector(`[data-up="${u.id}"]`);
      if (nb && !Input.touchMode) nb.focus();
      return;
    }
    Sfx.play('uiOk');
    switch (b.dataset.act) {
      case 'continue': Game.continueGame(); break;
      case 'new': Game.newGame(); break;
      case 'arena': Game.startArena(); break;
      case 'altar': this.show('upgrade', { from: 'menu' }); break;
      case 'altar-over': this.show('upgrade', { from: 'over' }); break;
      case 'help': this.show('help'); break;
      case 'back': this.show('menu'); break;
      case 'resume': Game.resume(); break;
      case 'restart': Game.restartEncounter(); break;
      case 'retry': Game.restartEncounter(); break;
      case 'menu': Game.toMenu(); break;
      case 'up-continue': {
        const d = this.data || {};
        if (d.next != null) { if (d.next < CHAPTERS.length) { Game.startChapter(d.next); } else Game.toMenu(); }
        else if (d.from === 'over') this.show('over');
        else this.show('menu');
        break;
      }
      case 'fullscreen': this.toggleFullscreen(); break;
    }
  },

  toggleFullscreen() {
    const d = document, el = d.documentElement;
    try {
      if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
      const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      if (p && p.then) p.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) { /* sin bloqueo */ } }).catch(() => {});
    } catch (e) { /* no disponible */ }
  },

  focusables() {
    const el = this.cur && document.getElementById('s-' + this.cur);
    if (!el) return [];
    return Array.from(el.querySelectorAll('button')).filter(b => !b.hidden && !b.disabled && b.offsetParent !== null);
  },
  move(dir) {
    const list = this.focusables();
    if (!list.length) return;
    const i = list.indexOf(document.activeElement);
    const n = i < 0 ? 0 : (i + dir + list.length) % list.length;
    list[n].focus();
    Sfx.play('ui');
  },
  back() {
    if (this.cur === 'pause') Game.resume();
    else if (this.cur === 'help') this.show('menu');
    else if (this.cur === 'upgrade') { const b = document.getElementById('up-continue'); if (b) b.click(); }
  },
  handleKey(e) {
    if (Game.state === 'playing') return false;
    if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); this.back(); return true; }
    if (e.code === 'ArrowDown' || e.code === 'ArrowRight') { e.preventDefault(); this.move(1); return true; }
    if (e.code === 'ArrowUp' || e.code === 'ArrowLeft') { e.preventDefault(); this.move(-1); return true; }
    return true;
  },
  gamepadNav(a) {
    if (a === 'down' || a === 'right') this.move(1);
    else if (a === 'up' || a === 'left') this.move(-1);
    else if (a === 'confirm') {
      const el = document.activeElement;
      if (el && el.tagName === 'BUTTON' && this.root.contains(el)) el.click();
      else this.move(0);
    } else if (a === 'back' || a === 'pause') this.back();
  },
};

/* ---- game.js ---- */
'use strict';
/* =========================================================
   Flujo del juego: capítulos, arenas y oleadas, el jefe,
   la Arena de los Dioses, guardado y bucle principal
   ========================================================= */
const DEFAULT_SAVE = { orbs: 0, up: { blades: 1, health: 1, rage: 1 }, chapter: 0, best: 0, beaten: false };

function makeWorld(mode, chapterIdx = 0) {
  const ch = mode === 'story' ? CHAPTERS[chapterIdx] : null;
  const W = {
    mode, chapterIdx, theme: ch ? ch.theme : mode === 'arena' ? 'costa' : 'templo',
    length: ch ? ch.length : 720, bounds: { l: 0, r: ch ? ch.length : 720 }, cam: { x: 0 }, zoom: 1, zoomCur: 1,
    hero: makeHero(Game.save.up), enemies: [], projs: [], orbs: [], spawnQ: [],
    encounters: ch ? ch.encounters : [], encIdx: 0, locked: false, waves: null, waveIdx: 0, waveDelay: 0,
    boss: null, title: null, toast: null, qte: null, finale: null, cinematic: false, time: 0, arenaN: 0,
    exitT: 0, done: false, attackers: 0,
  };
  if (mode === 'arena') { W.hero.x = 360; W.locked = true; W.bounds = { l: 20, r: 700 }; }
  if (mode === 'menu') { W.hero.x = 300; W.cam.x = 300 - Layout.VW * 0.3; }
  else W.cam.x = Math.max(-20, W.hero.x - Layout.VW * 0.42);
  return W;
}

const Game = {
  state: 'menu', world: null, save: null, settings: null, diffIdx: 1, diff: DIFFS[1],
  stats: { kills: 0, maxCombo: 0, orbs: 0, time: 0 }, hints: {}, wakeLock: null,

  init() {
    this.save = Object.assign({}, DEFAULT_SAVE, Store.get('save', {}));
    this.save.up = Object.assign({}, DEFAULT_SAVE.up, this.save.up || {});
    this.settings = Object.assign({ music: true, sfx: true, vib: true, diff: 1 }, Store.get('settings', {}));
    this.hints = Store.get('hints', {});
    this.setDiff(this.settings.diff);
    Sfx.setMusic(this.settings.music); Sfx.setSfx(this.settings.sfx);
    this.toMenu();
  },
  persist() { Store.set('save', this.save); },
  saveSettings() { Store.set('settings', this.settings); },
  setDiff(i) { this.diffIdx = clamp(i | 0, 0, 2); this.diff = DIFFS[this.diffIdx]; this.settings.diff = this.diffIdx; this.saveSettings(); },
  addOrbs(v) { this.save.orbs += v; this.stats.orbs += v; },
  resetStats() { this.stats = { kills: 0, maxCombo: 0, orbs: 0, time: 0 }; },

  hint(key) {
    if (this.hints[key] || !this.world) return;
    const t = Input.touchMode;
    const text = {
      controls: t ? '□ Ataque   △ Fuerte   ✕ Salto   ○ Esquivar\nMantén □ para encadenar el combo' : 'J Ataque   K Fuerte   Espacio Salto   L Esquivar\nMantén J para encadenar el combo',
      launch: '△ lanza a los enemigos al aire.\nSalta y sigue golpeando en el aire',
      finish: t ? 'Enemigo aturdido: pulsa ○ a su lado\npara rematarlo' : 'Enemigo aturdido: pulsa L a su lado\npara rematarlo',
      rage: t ? '¡Ira de Esparta lista!\nPulsa el botón de fuego' : '¡Ira de Esparta lista! Pulsa E',
      shield: 'Los hoplitas bloquean de frente.\nUsa △, salta o rueda a su espalda',
      boss: 'Golpea el ojo para hacer daño crítico.\nSalta las ondas de choque',
    }[key];
    if (!text) return;
    this.hints[key] = true; Store.set('hints', this.hints);
    this.toast(text, key === 'controls' ? 6 : 4.5);
  },
  toast(text, dur = 2.5) { if (this.world) this.world.toast = { text, t: 0, dur }; },

  /* ---------- Transiciones ---------- */
  toMenu() {
    this.state = 'menu';
    FX.clear();
    this.world = makeWorld('menu');
    Music.set('menu');
    this.releaseWake();
    UI.show('menu');
  },
  newGame() {
    this.save.chapter = 0; this.persist();
    this.resetStats();
    this.startChapter(0);
  },
  continueGame() { this.resetStats(); this.startChapter(clamp(this.save.chapter, 0, CHAPTERS.length - 1)); },
  startChapter(i, encIdx = 0, retry = false) {
    FX.clear();
    const W = this.world = makeWorld('story', i);
    if (encIdx > 0) {
      const prev = W.encounters[encIdx - 1];
      W.encIdx = encIdx; W.hero.x = prev.x + 120;
      W.cam.x = W.hero.x - Layout.VW * 0.42;
    }
    if (!retry) {
      const ch = CHAPTERS[i];
      W.title = { small: 'CAPÍTULO ' + ROMAN[i + 1], big: ch.name, sub: ch.intro, t: 0, dur: 4.2 };
      Sfx.play('gong');
    }
    this.play();
    Music.set('explore');
  },
  startArena() {
    FX.clear();
    this.resetStats();
    this.world = makeWorld('arena');
    this.world.title = { small: 'MODO DE SUPERVIVENCIA', big: 'Arena de los Dioses', sub: 'Resiste tantas oleadas como puedas', t: 0, dur: 3.4 };
    Sfx.play('gong');
    this.play();
    Music.set('combat');
  },
  play() {
    this.state = 'playing';
    Input.reset();
    UI.hide();
    this.requestWake();
  },
  pause() {
    if (this.state !== 'playing') return;
    this.state = 'paused';
    Input.reset();
    UI.show('pause');
  },
  resume() { if (this.state === 'paused') { this.play(); } },
  restartEncounter() {
    const W = this.world;
    if (W.mode === 'arena') { this.startArena(); return; }
    this.startChapter(W.chapterIdx, W.encIdx, true);
  },
  over() {
    if (this.state !== 'playing') return;
    this.state = 'over';
    this.persist();
    const W = this.world;
    if (W.mode === 'arena') {
      const n = Math.max(0, W.arenaN - 1);
      if (n > this.save.best) { this.save.best = n; this.persist(); }
    }
    Music.set(null);
    UI.show('over');
  },
  chapterComplete() {
    const W = this.world;
    this.save.chapter = W.chapterIdx + 1;
    this.persist();
    W.exitT = 0.001;
  },
  victory() {
    this.state = 'win';
    this.save.beaten = true; this.save.chapter = CHAPTERS.length;
    this.persist();
    Music.set('menu');
    UI.show('win');
  },
  summon(list) { if (this.world) queueWave(this.world, list); },

  requestWake() {
    try { if (navigator.wakeLock && !this.wakeLock) navigator.wakeLock.request('screen').then(l => { this.wakeLock = l; l.addEventListener('release', () => { this.wakeLock = null; }); }).catch(() => {}); } catch (e) { /* sin wake lock */ }
  },
  releaseWake() { try { if (this.wakeLock) this.wakeLock.release(); } catch (e) { /* nada */ } this.wakeLock = null; },

  /* ---------- Simulación ---------- */
  tick(step) {
    const W = this.world, h = W.hero;
    if (Input.pressed.has('pause')) { Input.pressed.delete('pause'); this.pause(); return; }
    if (Input.pressed.has('mute')) {
      Input.pressed.delete('mute');
      const on = !(this.settings.music || this.settings.sfx);
      this.settings.music = this.settings.sfx = on; Sfx.setMusic(on); Sfx.setSfx(on); this.saveSettings();
      this.toast(on ? 'Sonido activado' : 'Sonido desactivado', 1.4);
    }
    if (FX.hitstop > 0) { FX.hitstop -= step; return; }
    const dt = step * (FX.slowT > 0 ? FX.slowScale : 1);
    W.time += dt; this.stats.time += step;

    if (W.qte) { this.updateQTE(W, dt); }
    else {
      if (W.finale) this.updateFinale(W, dt);
      else heroUpdate(h, dt, W);
      updateEnemies(W, dt);
      updateProjs(W, h, dt);
      updateOrbs(W, h, dt);
      updateEncounters(W, dt);
    }
    FX.update(dt);
    updateCamera(W, dt);
    if (h.state === 'dead' && h.t > 1.9) this.over();
    if (W.exitT > 0) {
      W.exitT += step;
      if (W.exitT > 1.2) { UI.show('upgrade', { next: W.chapterIdx + 1 }); this.state = 'upgrade'; Music.set('menu'); }
    }
    Input.pressed.clear();
  },
  menuTick(dt) {
    const W = this.world;
    W.hero.anim += dt; W.time += dt;
    W.cam.x = W.hero.x - Layout.VW * (Layout.portrait ? 0.5 : 0.3) + Math.sin(W.time * 0.15) * 24;
    W.hero.face = 1;
    if (chance(0.3)) FX.embers(W.hero.x + rand(-120, 200), GY - rand(0, 80), 1, 'orange', 6);
    FX.update(dt); FX.updateReal(dt);
  },

  updateQTE(W, dt) {
    const q = W.qte;
    q.t += dt;
    q.prog = Math.max(0, q.prog - dt * 0.22);
    if (Input.pressed.has('dodge')) {
      q.prog = Math.min(1, q.prog + 0.085);
      Sfx.play('qte', q.prog); FX.shake(2, 0.08); vibrate(12);
      FX.blood(q.e.x + q.e.face * 14, q.e.y - 135, 3);
    }
    if (q.prog >= 1) {
      W.qte = null;
      W.finale = { t: 0, e: q.e, stabs: 0, sx: W.hero.x, sy: W.hero.y };
      W.cinematic = true;
      const h = W.hero;
      h.state = 'finisher'; h.t = 0; h.fin = { big: true, e: q.e }; h.face = Math.sign(q.e.x - h.x) || 1;
      FX.slow(0.6, 1.2);
    } else if (q.t >= q.dur) {
      W.qte = null; W.zoom = 1;
      const e = q.e;
      e.hp = e.hpMax * 0.12; e.phase = 3; go(e, 'roar'); e.roarDone = true;
      Sfx.play('roar'); FX.shake(8, 0.6);
      this.toast('¡Polifemo se resiste!', 2);
    }
  },
  updateFinale(W, dt) {
    const F = W.finale, h = W.hero, e = F.e;
    F.t += dt; h.t += dt; h.anim += dt;
    const eyeR = cyclopsEye(e), ex = eyeR.x + eyeR.w / 2, ey = eyeR.y + eyeR.h / 2;
    if (F.t < 1.4) {
      const p = easeOut(clamp(F.t / 0.4, 0, 1));
      h.x = lerp(F.sx, ex + e.face * 20, p); h.y = lerp(F.sy, ey + 40, p) - Math.sin(p * Math.PI) * 40;
      h.face = -e.face || 1;
      const stabs = [0.5, 0.8, 1.1];
      while (F.stabs < 3 && F.t >= stabs[F.stabs]) {
        F.stabs++;
        const last = F.stabs === 3;
        FX.blood(ex, ey, last ? 40 : 16, h.face); FX.spark(ex, ey, 10, h.face);
        FX.shake(last ? 12 : 6, 0.3); FX.stop(last ? 0.18 : 0.08);
        Sfx.play('hitHeavy'); vibrate(last ? 150 : 40);
        if (last) { e.blind = true; FX.flashScreen('255,240,220', 0.8); Sfx.play('roar'); FX.text(ex, ey - 30, '¡CEGADO!', '#ff4a3a', 18, 1.6); }
      }
    } else {
      if (!F.jumped) { F.jumped = true; F.jx = h.x; F.jy = h.y; go(e, 'dying'); FX.slow(0.5, 1.4); }
      const q = clamp((F.t - 1.4) / 0.5, 0, 1);
      h.x = lerp(F.jx, F.jx - h.face * 110, q); h.y = lerp(F.jy, GY, easeIn(q)) - Math.sin(q * Math.PI) * 50;
      if (q >= 1) { h.state = 'idle'; h.y = GY; }
      if (F.t > 3.9 && !F.done) {
        F.done = true;
        killEnemy(e, W, { kbx: 0 }, true);
        W.boss = null; W.cinematic = false; W.finale = null; W.zoom = 1;
        h.state = 'idle'; h.inv = 0.5; h.fin = null;
        if (W.mode === 'story') { W.locked = false; W.bounds = { l: 0, r: W.length }; W.encIdx++; setTimeout(() => this.state === 'playing' && this.victory(), 2200); }
        else { W.waveDelay = 0; }
        Sfx.play('cleared');
      }
    }
  },
};

/* ---------- Encuentros y oleadas ---------- */
function queueWave(W, list) {
  const q = [];
  for (const [type, n] of list) for (let i = 0; i < n; i++) q.push(type);
  for (let i = q.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [q[i], q[j]] = [q[j], q[i]]; }
  q.forEach((type, i) => W.spawnQ.push({ type, delay: 0.3 + i * 0.4 + rand(0, 0.2) }));
}

function spawnEnemy(W, type) {
  const h = W.hero, b = W.bounds;
  let x = (b.l + b.r) / 2;
  if (type === 'arquero') x = h.x < (b.l + b.r) / 2 ? b.r - rand(30, 90) : b.l + rand(30, 90);
  else for (let i = 0; i < 12; i++) { x = rand(b.l + 40, b.r - 40); if (Math.abs(x - h.x) > 120) break; }
  const e = makeEnemy(type, x);
  e.face = Math.sign(h.x - x) || -1;
  W.enemies.push(e);
  if (type === 'hoplita') Game.hint('shield');
  if (type === 'minotauro') { Sfx.play('bull'); FX.shake(4, 0.4); }
  return e;
}

function spawnBoss(W, x, hpMul = 1) {
  const e = makeEnemy('ciclope', x, { hpMul });
  e.face = Math.sign(W.hero.x - x) || -1;
  W.boss = e; W.enemies.push(e); W.cinematic = true;
  Music.set('boss');
  setTimeout(() => Game.hint('boss'), 2600);
  return e;
}

function updateSpawns(W, dt) {
  for (let i = W.spawnQ.length - 1; i >= 0; i--) {
    const s = W.spawnQ[i];
    s.delay -= dt;
    if (s.delay <= 0) { W.spawnQ.splice(i, 1); spawnEnemy(W, s.type); }
  }
}

function updateEncounters(W, dt) {
  const h = W.hero;
  if (W.mode === 'arena') { updateArena(W, dt); return; }
  if (!W.locked) {
    const enc = W.encounters[W.encIdx];
    if (enc && h.x >= enc.x - 150) startEncounter(W, enc);
    else if (!enc && !W.boss && h.x >= W.length - 70 && !W.done && W.mode === 'story' && W.chapterIdx < CHAPTERS.length - 1) { W.done = true; Game.chapterComplete(); }
    return;
  }
  updateSpawns(W, dt);
  if (W.boss) return;
  const busy = W.spawnQ.length || W.enemies.some(e => e.alive);
  if (busy) { W.waveDelay = 0; return; }
  W.waveDelay += dt;
  if (W.waveDelay < 1) return;
  W.waveDelay = 0;
  W.waveIdx++;
  if (W.waveIdx < W.waves.length) { queueWave(W, W.waves[W.waveIdx]); return; }
  W.locked = false; W.bounds = { l: 0, r: W.length }; W.encIdx++;
  Sfx.play('cleared'); Music.set('explore');
  Game.toast(W.encIdx < W.encounters.length ? 'Arena despejada. Sigue adelante' : 'Camino despejado', 2.2);
  Game.persist();
}

function startEncounter(W, enc) {
  W.locked = true;
  const w = enc.width || ARENA_W;
  W.bounds = { l: enc.x - w / 2, r: enc.x + w / 2 };
  W.waveIdx = 0; W.waveDelay = 0;
  if (enc.boss) { W.waves = null; spawnBoss(W, enc.x + 160); }
  else { W.waves = enc.waves; queueWave(W, enc.waves[0]); Music.set('combat'); }
  if (enc.tutorial) Game.hint('controls');
}

function updateArena(W, dt) {
  updateSpawns(W, dt);
  if (W.boss || W.finale) return;
  const busy = W.spawnQ.length || W.enemies.some(e => e.alive);
  if (busy) { W.waveDelay = 0; return; }
  W.waveDelay += dt;
  if (W.waveDelay < (W.arenaN ? 2 : 0.8)) return;
  W.waveDelay = 0;
  W.arenaN++;
  const n = W.arenaN;
  const theme = ['costa', 'templo', 'volcan'][Math.floor((n - 1) / 5) % 3];
  if (theme !== W.theme) { W.theme = theme; FX.flashScreen('0,0,0', 0.8); }
  if (n > 1) { W.hero.hp = Math.min(W.hero.hpMax, W.hero.hp + W.hero.hpMax * 0.15); Sfx.play('cleared'); }
  if (n - 1 > Game.save.best) { Game.save.best = n - 1; Game.persist(); }
  Game.toast('Oleada ' + n, 1.6);
  const wave = arenaWave(n);
  if (wave[0][0] === 'ciclope') { spawnBoss(W, W.hero.x < 360 ? 560 : 160, 0.5 + 0.15 * (n / 10 - 1)); Game.toast('Oleada ' + n + ': ¡Polifemo!', 2); }
  else { queueWave(W, wave); Music.set('combat'); }
}

function updateCamera(W, dt) {
  const VW = Layout.VW, h = W.hero;
  let target = h.x - VW * 0.42 + h.face * 20;
  if (W.locked) {
    const aw = W.bounds.r - W.bounds.l;
    target = aw <= VW ? (W.bounds.l + W.bounds.r) / 2 - VW / 2 : clamp(target, W.bounds.l - 10, W.bounds.r - VW + 10);
  } else target = clamp(target, -20, W.length - VW + 20);
  W.cam.x = lerp(W.cam.x, target, 1 - Math.pow(0.004, dt));
  W.zoomCur = lerp(W.zoomCur, W.zoom, 1 - Math.pow(0.02, dt));
}

/* ---------- Arranque y bucle ---------- */
let lastT = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - (lastT || now)) / 1000);
  lastT = now;
  Input.pollGamepad();
  if (Game.state === 'playing') {
    FX.updateReal(dt);
    acc += dt;
    const step = 1 / 60;
    let n = 0;
    while (acc >= step && n < 5) { acc -= step; n++; Game.tick(step); if (Game.state !== 'playing') break; }
    if (n >= 5) acc = 0;
  } else if (Game.state === 'menu') Game.menuTick(dt);
  render(dt);
}

function boot() {
  const cv = document.getElementById('game');
  initRender(cv);
  FX.initGlow();
  const onResize = () => { Layout.update(); resizeCanvas(); };
  onResize();
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 250));
  Input.init(cv);
  UI.build();
  Game.init();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { Game.pause(); try { if (Sfx.ctx) Sfx.ctx.suspend(); } catch (e) { /* nada */ } }
    else Sfx.resume();
  });
  try { if (document.fonts) document.fonts.load('700 16px Cinzel').then(() => { R.key = ''; }).catch(() => {}); } catch (e) { /* sin fuentes */ }
  requestAnimationFrame(frame);
}
