function arenaWave(n) {
  // Oleadas crecientes para la Arena de los Dioses
  const list = [];
  if (n % 10 === 0) { list.push(['ciclope', 1]); return list; }
  let budget = 3 + n * 1.6;
  const pool = [['legion', 1]];
  if (n >= 2) pool.push(['arpia', 1.2]);
  if (n >= 3) pool.push(['hoplita', 2]);
  if (n >= 4) pool.push(['arquero', 1.6]);
  if (n % 5 === 0 || (n > 6 && chance(0.35))) { list.push(['minotauro', 1]); budget -= 7; }
  const count = {};
  while (budget > 0.9) {
    const [t, c] = pick(pool);
    count[t] = (count[t] || 0) + 1; budget -= c;
  }
  for (const t in count) list.push([t, count[t]]);
  return list;
}

/* ---- fx.js ---- */
'use strict';
/* =========================================================
   Efectos: partículas, estelas de las cadenas, ondas, textos,
   temblor de cámara, congelado de impacto y cámara lenta
   ========================================================= */
const GLOW_COLORS = {
  orange: '255,130,30', red: '255,40,30', green: '90,255,120', white: '255,250,235',
  gold: '255,205,90', blue: '120,190,255', purple: '200,110,255',
};

const FX = {
  parts: [], decals: [], rings: [], texts: [], trails: {},
  shakeT: 0, shakeMag: 0, flash: 0, flashCol: '255,255,255',
  hitstop: 0, slowT: 0, slowScale: 1, glow: {},

  initGlow() {
    for (const k in GLOW_COLORS) {
      const cv = document.createElement('canvas');
      cv.width = cv.height = 64;
      const c = cv.getContext('2d');
      const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0, `rgba(${GLOW_COLORS[k]},1)`);
      g.addColorStop(0.25, `rgba(${GLOW_COLORS[k]},0.55)`);
      g.addColorStop(1, `rgba(${GLOW_COLORS[k]},0)`);
      c.fillStyle = g; c.fillRect(0, 0, 64, 64);
      this.glow[k] = cv;
    }
  },
  clear() { this.parts.length = 0; this.decals.length = 0; this.rings.length = 0; this.texts.length = 0; this.trails = {}; this.slowT = 0; this.hitstop = 0; this.flash = 0; },

  add(p) { if (this.parts.length < 520) this.parts.push(p); },
  spark(x, y, n, dir = 0, col = 'orange') {
    for (let i = 0; i < n; i++) {
      const a = dir ? (dir > 0 ? 0 : Math.PI) + rand(-1, 1) : rand(0, TAU), sp = rand(120, 420);
      this.add({ k: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: rand(0.18, 0.42), max: 0.42, g: 500, col, size: rand(1, 2.2) });
    }
  },
  blood(x, y, n, dir = 0) {
    for (let i = 0; i < n; i++) {
      const sp = rand(60, 300);
      const a = dir ? (dir > 0 ? rand(-1.2, 0.3) : Math.PI + rand(-0.3, 1.2)) : rand(-Math.PI, 0);
      this.add({ k: 'blood', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, life: rand(0.5, 1), max: 1, g: 900, size: rand(1.2, 3), col: pick(['#7a0a0a', '#9c1010', '#5c0606']) });
    }
  },
  dust(x, y, n, spread = 20, col = '120,105,90') {
    for (let i = 0; i < n; i++) {
      this.add({ k: 'dust', x: x + rand(-spread, spread), y: y - rand(0, 6), vx: rand(-60, 60), vy: rand(-40, -5), life: rand(0.4, 0.9), max: 0.9, size: rand(4, 9), grow: 14, col });
    }
  },
  ash(x, y, w, h, n) {
    for (let i = 0; i < n; i++) {
      this.add({ k: 'ash', x: x + rand(-w / 2, w / 2), y: y - rand(0, h), vx: rand(-20, 20), vy: rand(-70, -20), life: rand(0.6, 1.4), max: 1.4, size: rand(1.5, 3.5), col: pick(['#2b2420', '#3d332c', '#14100e']) });
    }
  },
  embers(x, y, n, col = 'orange', spread = 10) {
    for (let i = 0; i < n; i++) {
      this.add({ k: 'ember', x: x + rand(-spread, spread), y: y + rand(-spread, spread), vx: rand(-40, 40), vy: rand(-120, -30), life: rand(0.3, 0.8), max: 0.8, size: rand(1, 2.4), col });
    }
  },
  fire(x, y, n, col = 'orange') {
    for (let i = 0; i < n; i++) {
      this.add({ k: 'fire', x: x + rand(-3, 3), y: y + rand(-3, 3), vx: rand(-25, 25), vy: rand(-90, -30), life: rand(0.2, 0.45), max: 0.45, size: rand(4, 8), col });
    }
  },
  debris(x, y, n, col = '#3a302a') {
    for (let i = 0; i < n; i++) {
      const a = rand(-Math.PI * 0.95, -Math.PI * 0.05), sp = rand(100, 380);
      this.add({ k: 'debris', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.7, 1.3), max: 1.3, g: 1000, size: rand(2, 4.5), col, rot: rand(0, TAU), vr: rand(-12, 12) });
    }
  },
  ring(x, y, r0, r1, dur, col = '255,170,80', w = 4) { this.rings.push({ x, y, r0, r1, t: 0, dur, col, w }); },
  text(x, y, str, col = '#ffd27a', size = 16, dur = 1) { this.texts.push({ x, y, str, col, size, t: 0, dur }); },
  shake(mag, t = 0.25) { if (mag >= this.shakeMag * (this.shakeT > 0 ? 1 : 0)) { this.shakeMag = mag; this.shakeT = t; } },
  stop(t) { this.hitstop = Math.max(this.hitstop, t); },
  slow(scale, t) { this.slowScale = scale; this.slowT = t; },
  flashScreen(col, a) { this.flashCol = col; this.flash = Math.max(this.flash, a); },
  trail(key, ix, iy, tx, ty, fire) {
    const arr = this.trails[key] || (this.trails[key] = []);
    arr.push({ ix, iy, tx, ty, life: 0.14, fire });
    if (arr.length > 14) arr.shift();
  },

  update(dt) {
    const ps = this.parts;
    for (let i = ps.length - 1; i >= 0; i--) {
      const p = ps[i];
      p.life -= dt;
      if (p.life <= 0) { ps.splice(i, 1); continue; }
      if (p.g) p.vy += p.g * dt;
      if (p.k === 'dust' || p.k === 'smoke') { p.vx *= 0.92; p.vy *= 0.94; p.size += p.grow * dt; }
      if (p.k === 'spark') { p.vx *= 0.9; p.vy *= 0.9; }
      if (p.vr) p.rot += p.vr * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if ((p.k === 'blood' || p.k === 'debris') && p.y > GY) {
        if (p.k === 'blood') {
          if (this.decals.length > 70) this.decals.shift();
          this.decals.push({ x: p.x, y: GY + rand(0, 4), w: rand(3, 8), life: 7 });
          ps.splice(i, 1); continue;
        }
        p.y = GY; p.vy *= -0.35; p.vx *= 0.6; p.vr *= 0.5;
      }
    }
    for (let i = this.decals.length - 1; i >= 0; i--) { const d = this.decals[i]; d.life -= dt; if (d.life <= 0) this.decals.splice(i, 1); }
    for (let i = this.rings.length - 1; i >= 0; i--) { const r = this.rings[i]; r.t += dt; if (r.t >= r.dur) this.rings.splice(i, 1); }
    for (let i = this.texts.length - 1; i >= 0; i--) { const t = this.texts[i]; t.t += dt; if (t.t >= t.dur) this.texts.splice(i, 1); }
    for (const k in this.trails) {
      const arr = this.trails[k];
      for (let i = arr.length - 1; i >= 0; i--) { arr[i].life -= dt; if (arr[i].life <= 0) arr.splice(i, 1); }
    }
  },
  // Tiempo real (no se congela con el hitstop)
  updateReal(dt) {
    if (this.shakeT > 0) { this.shakeT -= dt; if (this.shakeT <= 0) this.shakeMag = 0; }
    if (this.flash > 0) this.flash = Math.max(0, this.flash - dt * 2.2);
    if (this.slowT > 0) { this.slowT -= dt; if (this.slowT <= 0) this.slowScale = 1; }
  },
  shakeOffset() {
    if (this.shakeT <= 0) return [0, 0];
    const m = this.shakeMag * Math.min(1, this.shakeT * 5);
    return [rand(-m, m), rand(-m, m)];
  },

  drawGlow(c, col, x, y, r, a = 1) {
    const g = this.glow[col]; if (!g) return;
    c.globalAlpha = a;
    c.drawImage(g, x - r, y - r, r * 2, r * 2);
  },
  drawDecals(c) {
    for (const d of this.decals) {
      c.globalAlpha = Math.min(1, d.life / 2) * 0.7;
      c.fillStyle = '#4a0606';
      c.beginPath(); c.ellipse(d.x, d.y, d.w, 1.6, 0, 0, TAU); c.fill();
    }
    c.globalAlpha = 1;
  },
  drawTrails(c) {
    c.globalCompositeOperation = 'lighter';
    c.lineCap = 'round';
    for (const k in this.trails) {
      const arr = this.trails[k];
      for (let i = 1; i < arr.length; i++) {
        const a = arr[i - 1], b = arr[i];
        const al = Math.min(a.life, b.life) / 0.14;
        // cinta suave entre la mitad exterior de la cadena y la punta
        c.globalAlpha = al * 0.4;
        c.fillStyle = b.fire ? '#ffb83a' : '#e0480f';
        c.beginPath();
        c.moveTo(a.ix, a.iy); c.lineTo(a.tx, a.ty); c.lineTo(b.tx, b.ty); c.lineTo(b.ix, b.iy);
        c.closePath(); c.fill();
        // filo brillante por donde pasa la hoja
        c.globalAlpha = al * 0.9;
        c.strokeStyle = b.fire ? '#fff0b8' : '#ffc27a';
        c.lineWidth = 1 + al * 2;
        c.beginPath(); c.moveTo(a.tx, a.ty); c.lineTo(b.tx, b.ty); c.stroke();
      }
    }
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';
  },
  draw(c) {
    // partículas normales
    for (const p of this.parts) {
      const a = clamp(p.life / p.max, 0, 1);
      if (p.k === 'blood' || p.k === 'ash' || p.k === 'debris') {
        c.globalAlpha = p.k === 'ash' ? a : 1;
        c.fillStyle = p.col;
        if (p.k === 'debris') {
          c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.8); c.restore();
        } else c.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      } else if (p.k === 'dust') {
        c.globalAlpha = a * 0.35;
        c.fillStyle = `rgb(${p.col})`;
        c.beginPath(); c.arc(p.x, p.y, p.size, 0, TAU); c.fill();
      }
    }
    for (const r of this.rings) {
      const p = r.t / r.dur;
      c.globalAlpha = (1 - p) * 0.9;
      c.strokeStyle = `rgb(${r.col})`;
      c.lineWidth = r.w * (1 - p) + 0.5;
      c.beginPath(); c.ellipse(r.x, r.y, lerp(r.r0, r.r1, easeOut(p)), lerp(r.r0, r.r1, easeOut(p)) * 0.35, 0, 0, TAU); c.stroke();
    }
    // partículas luminosas
    c.globalCompositeOperation = 'lighter';
    for (const p of this.parts) {
      const a = clamp(p.life / p.max, 0, 1);
      if (p.k === 'spark') {
        c.globalAlpha = a;
        c.strokeStyle = p.col === 'orange' ? '#ffb347' : p.col === 'white' ? '#fff6dd' : p.col === 'blue' ? '#a8d8ff' : '#ff6b4a';
        c.lineWidth = p.size;
        c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); c.stroke();
      } else if (p.k === 'ember') {
        this.drawGlow(c, p.col, p.x, p.y, p.size * 3, a);
      } else if (p.k === 'fire') {
        this.drawGlow(c, p.col, p.x, p.y, p.size * (0.5 + a), a * 0.9);
      }
    }
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';
    // textos flotantes
    for (const t of this.texts) {
      const p = t.t / t.dur;
      const s = p < 0.15 ? lerp(1.6, 1, p / 0.15) : 1;
      c.globalAlpha = p > 0.7 ? (1 - p) / 0.3 : 1;
      c.font = `700 ${Math.round(t.size * s)}px Cinzel, Georgia, serif`;
      c.textAlign = 'center';
      c.lineWidth = 3; c.strokeStyle = 'rgba(10,4,2,0.85)';
      const y = t.y - p * 18;
      c.strokeText(t.str, t.x, y);
      c.fillStyle = t.col; c.fillText(t.str, t.x, y);
    }
    c.globalAlpha = 1;
  },
};

/* ---- hero.js ---- */
'use strict';
/* =========================================================
   El Fantasma de Esparta: movimiento, combos con las cadenas,
   esquiva, remates y la Ira de Esparta
   ========================================================= */
const HERO = { speed: 180, accel: 1700, airAccel: 1250, friction: 2000, jumpV: 480, djumpV: 430, grav: 1500, maxFall: 950 };

function makeHero(up) {
  const hpMax = 100 + 25 * (up.health - 1);
  return {
    x: 150, y: GY, vx: 0, vy: 0, face: 1, onGround: true, jumps: 0, airAtk: 0, airDodged: false,
    state: 'idle', t: 0, atk: null, prevA: 0, hitSet: new Set(), multiT: 0, swung: false,
    slamPhase: 0, dodgeDir: 1, fin: null,
    hp: hpMax, hpMax, hpLag: hpMax, rage: 0, rageT: 0,
    rageMax: 8 + 2 * (up.rage - 1), rageFill: 1 + 0.15 * (up.rage - 1), dmgMult: 1 + 0.22 * (up.blades - 1),
    inv: 0, flash: 0, anim: 0, runPhase: 0, buf: {}, combo: 0, comboT: 0, perfectT: 0,
  };
}

const heroOrigin = h => ({ x: h.x + h.face * 2, y: h.y - 44 });
function heroBox(h) {
  if (h.state === 'dodge') return { x: h.x - 9, y: h.y - 30, w: 18, h: 30 };
  return { x: h.x - 9, y: h.y - 58, w: 18, h: 58 };
}

function attackAngle(A, t) {
  const [s, e] = A.act;
  const dir = Math.sign(A.a1 - A.a0);
  if (t < s) return lerp(A.a0 - 0.35 * dir, A.a0, easeOut(t / s));
  if (t <= e) { const p = (t - s) / (e - s); return lerp(A.a0, A.a1, A.multi ? p : easeInOut(p)); }
  return A.a1 + 0.15 * dir * easeOut(clamp((t - e) / (A.dur - e), 0, 1));
}
function attackReach(A, t) {
  const [s, e] = A.act;
  if (t < s - 0.06) return 10;
  if (t < s) return lerp(10, A.reach, (t - (s - 0.06)) / 0.06);
  if (t <= e) return A.reach;
  return lerp(A.reach, 10, easeOut(clamp(((t - e) / (A.dur - e)) * 1.5, 0, 1)));
}

// Estado de las dos hojas (R = mano cercana, L = mano lejana) para la lógica y el dibujo
function bladeState(h) {
  const br = Math.sin(h.anim * 2.4) * 0.05;
  let R = { a: 1.25 + br, reach: 0 }, L = { a: 1.85 - br, reach: 0 };
  switch (h.state) {
    case 'run': { const s = Math.sin(h.runPhase); R = { a: 1.45 - s * 0.75, reach: 0 }; L = { a: 1.7 + s * 0.75, reach: 0 }; break; }
    case 'air': R = { a: h.vy < 0 ? 0.2 : 0.7, reach: 0 }; L = { a: h.vy < 0 ? 2.7 : 2.3, reach: 0 }; break;
    case 'dodge': R = { a: 0.9, reach: 0 }; L = { a: 1.2, reach: 0 }; break;
    case 'hurt': R = { a: -2.3, reach: 0 }; L = { a: 2.5, reach: 0 }; break;
    case 'dead': R = { a: 1.6, reach: 0 }; L = { a: 1.6, reach: 0 }; break;
    case 'finisher': {
      const k = (h.t * (h.fin && h.fin.big ? 3.2 : 3.6)) % 1;
      R = { a: lerp(-1.9, 1.0, easeIn(k)), reach: 22 }; L = { a: 0.2, reach: 16 };
      break;
    }
    case 'attack': {
      const A = ATTACKS[h.atk];
      if (h.atk === 'slam') {
        const a = h.slamPhase < 2 ? -2.4 : 1.15;
        R = { a, reach: 26, act: h.slamPhase === 2 }; L = { a: a + 0.2, reach: 24, act: h.slamPhase === 2 };
        break;
      }
      const a = attackAngle(A, h.t), r = attackReach(A, h.t), act = h.t >= A.act[0] - 0.02 && h.t <= A.act[1] + 0.05;
      if (A.arm === 'R') R = { a, reach: r, act };
      else if (A.arm === 'L') L = { a, reach: r, act };
      else if (A.arm === 'B') { R = { a, reach: r, act }; L = { a: a + 0.22, reach: r * 0.96, act }; }
      else { R = { a, reach: r, act }; L = { a: a + Math.PI, reach: r, act }; }
      break;
    }
  }
  return { R, L };
}

function heroUpdate(h, dt, W) {
  h.t += dt; h.anim += dt;
  for (const k in h.buf) h.buf[k] -= dt;
  for (const a of Input.pressed) if (a !== 'pause' && a !== 'mute') h.buf[a] = 0.25;
  if (h.inv > 0) h.inv -= dt;
  if (h.flash > 0) h.flash -= dt;
  if (h.perfectT > 0) h.perfectT -= dt;
  if (h.hpLag > h.hp) h.hpLag = Math.max(h.hp, h.hpLag - dt * 45); else h.hpLag = h.hp;
  if (h.comboT > 0) { h.comboT -= dt; if (h.comboT <= 0) h.combo = 0; }
  if (h.rageT > 0) {
    h.rageT -= dt;
    h.rage = 100 * Math.max(0, h.rageT) / h.rageMax;
    if (h.rageT <= 0) { h.rageT = 0; h.rage = 0; }
    if (chance(0.5)) FX.fire(h.x + rand(-10, 10), h.y - rand(10, 50), 1, 'orange');
  }
  if (h.state === 'dead') { heroPhysics(h, dt, W); h.vx = approach(h.vx, 0, 600 * dt); return; }
  if (want(h, 'rage') && h.rage >= 100 && h.rageT <= 0 && h.state !== 'finisher') activateRage(h, W);

  const ax = Input.axisX();
  switch (h.state) {
    case 'idle': case 'run': case 'air': freeMove(h, dt, ax, W); break;
    case 'attack': attackUpdate(h, dt, ax, W); break;
    case 'dodge': {
      const p = h.t / 0.38;
      h.vx = h.dodgeDir * 340 * (1 - p * p * 0.85);
      if (h.t > 0.26 && want(h, 'light')) { use(h, 'light'); startAttack(h, h.onGround ? 'l1' : 'a1', ax); break; }
      if (h.t >= 0.38) h.state = h.onGround ? 'idle' : 'air';
      break;
    }
    case 'hurt':
      h.vx = approach(h.vx, 0, 900 * dt);
      if (h.t > 0.32) h.state = h.onGround ? 'idle' : 'air';
      break;
    case 'finisher': finisherUpdate(h, dt, W); break;
  }
  if (h.state !== 'finisher') heroPhysics(h, dt, W);
}

function want(h, a) { return h.buf[a] > 0 || (a === 'light' && Input.isDown('light')); }
function use(h, a) { h.buf[a] = 0; }

function heroPhysics(h, dt, W) {
  const g = h.state === 'dodge' && !h.onGround ? HERO.grav * 0.3 : HERO.grav;
  h.vy = Math.min(h.vy + g * dt, HERO.maxFall);
  h.x += h.vx * dt; h.y += h.vy * dt;
  if (h.y >= GY) {
    if (!h.onGround) {
      h.onGround = true; h.jumps = 0; h.airAtk = 0; h.airDodged = false;
      if (h.vy > 350) { FX.dust(h.x, GY, 5, 10); Sfx.play('land'); }
      if (h.state === 'air') h.state = 'idle';
      if (h.state === 'attack' && h.atk === 'slam' && h.slamPhase === 1) slamImpact(h, W);
    }
    h.y = GY; h.vy = 0;
  } else h.onGround = false;
  h.x = clamp(h.x, W.bounds.l + 12, W.bounds.r - 12);
}

function freeMove(h, dt, ax, W) {
  h.vx = approach(h.vx, ax * HERO.speed, (h.onGround ? HERO.accel : HERO.airAccel) * dt);
  if (Math.abs(ax) > 0.2) h.face = Math.sign(ax);
  if (h.onGround) h.state = Math.abs(h.vx) > 20 ? 'run' : 'idle';
  else h.state = 'air';
  if (h.state === 'run') h.runPhase += dt * Math.abs(h.vx) / 13;
  if (want(h, 'jump')) { use(h, 'jump'); tryJump(h); }
  if (want(h, 'dodge')) {
    use(h, 'dodge');
    const f = findFinishTarget(h, W);
    if (f) { startFinisher(h, f, W); return; }
    if (h.onGround || !h.airDodged) startDodge(h, ax);
    return;
  }
  if (want(h, 'light')) {
    const id = h.onGround ? 'l1' : (h.airAtk < 2 ? 'a1' : null);
    if (id) { use(h, 'light'); startAttack(h, id, ax); return; }
  }
  if (want(h, 'heavy')) { use(h, 'heavy'); startAttack(h, h.onGround ? 'h1' : 'slam', ax); }
}

function tryJump(h) {
  if (h.onGround) {
    h.vy = -HERO.jumpV; h.onGround = false; h.jumps = 1; h.state = 'air';
    Sfx.play('jump'); FX.dust(h.x, GY, 3, 6);
  } else if (h.jumps < 2) {
    h.vy = -HERO.djumpV; h.jumps = 2; h.state = 'air';
    Sfx.play('jump'); FX.ring(h.x, h.y, 4, 26, 0.3, '255,200,140', 2);
  }
}

function startDodge(h, ax) {
  const dir = Math.abs(ax) > 0.2 ? Math.sign(ax) : h.face;
  h.state = 'dodge'; h.t = 0; h.dodgeDir = dir; h.face = dir;
  h.inv = Math.max(h.inv, 0.34);
  if (!h.onGround) { h.vy = Math.min(h.vy, -60); h.airDodged = true; }
  Sfx.play('dodge'); FX.dust(h.x, GY, 4, 8);
}

function startAttack(h, id, ax) {
  const A = ATTACKS[id];
  if (Math.abs(ax) > 0.3) h.face = Math.sign(ax);
  h.state = 'attack'; h.atk = id; h.t = 0; h.hitSet = new Set(); h.multiT = 0; h.prevA = A.a0; h.swung = false;
  if (id === 'a1') h.airAtk++;
  if (id === 'slam') { h.vy = -170; h.vx = 0; h.slamPhase = 0; }
  else if (A.air) h.vy = Math.min(h.vy, -70);
}

function attackUpdate(h, dt, ax, W) {
  const A = ATTACKS[h.atk];
  if (h.atk === 'slam') { slamUpdate(h, dt, W); return; }
  if (h.onGround && !A.air) {
    if (A.lunge && h.t < A.act[1]) {
      // no atravesar al enemigo que tenemos delante
      const blocked = W.enemies.some(e => e.alive && !e.T.fly && Math.abs(e.y - h.y) < 30 && (e.x - h.x) * h.face > 0 && Math.abs(e.x - h.x) < 26 + e.w / 2);
      h.vx = blocked ? 0 : h.face * A.lunge * (1 - h.t / A.act[1]);
    } else h.vx = approach(h.vx, 0, HERO.friction * dt);
  } else {
    h.vx = approach(h.vx, ax * 70, 700 * dt);
    if (A.air) h.vy = Math.min(h.vy, 45);
  }
  if (!h.swung && h.t >= A.act[0] - 0.03) { h.swung = true; Sfx.play(A.sfx); }
  const cur = attackAngle(A, h.t);
  if (h.t >= A.act[0] && h.t <= A.act[1] + dt) {
    if (A.multi) { h.multiT -= dt; if (h.multiT <= 0) { h.multiT = A.multi; h.hitSet.clear(); } }
    bladeHits(h, A, h.prevA, cur, W);
  }
  h.prevA = cur;
  pushTrails(h);
  if (h.t >= A.act[1]) {
    if (want(h, 'dodge')) {
      use(h, 'dodge');
      const f = findFinishTarget(h, W);
      if (f) { startFinisher(h, f, W); return; }
      if (h.onGround || !h.airDodged) { startDodge(h, ax); return; }
    }
    if (want(h, 'heavy')) { use(h, 'heavy'); startAttack(h, h.onGround ? 'h1' : 'slam', ax); return; }
    if (want(h, 'light')) {
      let nx = A.next;
      if (!h.onGround && !A.air) nx = h.airAtk < 2 ? 'a1' : null;
      if (h.onGround && A.air) nx = 'l1';
      if (nx && h.t >= A.act[1] + 0.04) { use(h, 'light'); startAttack(h, nx, ax); return; }
    }
    if (want(h, 'jump') && (h.onGround || h.jumps < 2)) { use(h, 'jump'); tryJump(h); return; }
  }
  if (h.t >= A.dur) h.state = h.onGround ? 'idle' : 'air';
}

function pushTrails(h) {
  const bs = bladeState(h), o = heroOrigin(h), fire = h.rageT > 0;
  for (const k of ['R', 'L']) {
    const b = bs[k];
    if (!b.act || b.reach < 30) continue;
    const dx = Math.cos(b.a) * h.face, dy = Math.sin(b.a);
    FX.trail(k, o.x + dx * b.reach * 0.68, o.y + dy * b.reach * 0.68, o.x + dx * b.reach, o.y + dy * b.reach, fire);
    if (fire && chance(0.6)) FX.fire(o.x + dx * b.reach, o.y + dy * b.reach, 1, 'gold');
  }
}

function bladeHits(h, A, a0, a1, W) {
  const o = heroOrigin(h);
  const reach = attackReach(A, h.t);
  const offs = A.arm === 'S' ? [0, Math.PI] : A.arm === 'B' ? [0, 0.22] : [0];
  const steps = Math.max(1, Math.ceil(Math.abs(a1 - a0) / 0.2));
  const sample = (fn) => {
    for (const off of offs) for (let s = 0; s <= steps; s++) {
      const a = lerp(a0, a1, s / steps) + off;
      const dx = Math.cos(a) * h.face, dy = Math.sin(a);
      for (let d = 0.2; d <= 1.001; d += 0.2) {
        const px = o.x + dx * reach * d, py = o.y + dy * reach * d;
        if (fn(px, py)) return { x: px, y: py };
      }
    }
    return null;
  };
  for (const e of W.enemies) {
    if (!canHit(e) || h.hitSet.has(e)) continue;
    const r = enemyBox(e);
    const pt = sample((px, py) => inRect(px, py, r, 5));
    if (pt) { h.hitSet.add(e); heroHitEnemy(h, e, A, pt, W); }
  }
  // las hojas desvían flechas y rocas pequeñas
  for (const p of W.projs) {
    if (p.k !== 'arrow' || p.dead) continue;
    if (sample((px, py) => Math.abs(px - p.x) < 10 && Math.abs(py - p.y) < 10)) {
      p.dead = true; FX.spark(p.x, p.y, 6, 0, 'white'); Sfx.play('clang');
    }
  }
}

function heroHitEnemy(h, e, A, pt, W) {
  const rage = h.rageT > 0;
  const late = A.endKb && h.t > A.act[1] - (A.multi || 0) * 1.3;
  const kb = late ? A.endKb : A.kb;
  const res = damageEnemy(e, {
    dmg: A.dmg * h.dmgMult * (rage ? 1.6 : 1), kbx: kb[0] * h.face, kby: kb[1],
    launch: A.launch, heavy: A.heavy || rage || late, breaks: A.breaks || rage, dir: h.face, x: pt.x, y: pt.y, src: h,
  }, W);
  if (!res) return;
  if (res === 'block') {
    FX.spark(pt.x, pt.y, 8, -h.face, 'white'); Sfx.play('clang'); FX.stop(0.04);
    h.vx = -h.face * 90;
    return;
  }
  FX.blood(pt.x, pt.y, A.heavy ? 10 : 5, h.face);
  FX.spark(pt.x, pt.y, A.heavy ? 8 : 4, h.face);
  FX.stop(A.stop || 0.04);
  FX.shake(A.shake || 1.6, 0.12);
  Sfx.play(A.heavy || late ? 'hitHeavy' : 'hit');
  if (res === 'crit') { Sfx.play('crit'); FX.text(pt.x, pt.y - 12, '¡CRÍTICO!', '#ffe08a', 13, 0.8); }
  if (A.launch && !e.T.big) Game.hint('launch');
  h.combo++; h.comboT = 2.4;
  Game.stats.maxCombo = Math.max(Game.stats.maxCombo, h.combo);
  if (!rage) h.rage = Math.min(100, h.rage + 2.4 * h.rageFill);
  else h.hp = Math.min(h.hpMax, h.hp + 0.6);
  if (h.rage >= 100 && !rage) Game.hint('rage');
  vibrate(A.heavy ? 18 : 8);
}

function slamUpdate(h, dt, W) {
  if (h.slamPhase === 0) {
    h.vx = 0; h.vy = Math.min(h.vy, 30);
    if (h.t > 0.16) { h.slamPhase = 1; h.vy = 980; Sfx.play('swingHeavy'); }
  } else if (h.slamPhase === 1) {
    h.vx = 0; h.vy = 980;
    pushTrails(h);
  } else if (h.slamPhase === 2) {
    h.vx = 0;
    if (h.t > 0.34) h.state = 'idle';
    else if (h.t > 0.18) {
      if (want(h, 'light')) { use(h, 'light'); startAttack(h, 'l1', Input.axisX()); }
      else if (want(h, 'dodge')) { use(h, 'dodge'); startDodge(h, Input.axisX()); }
    }
  }
}

function slamImpact(h, W) {
  h.slamPhase = 2; h.t = 0;
  const rage = h.rageT > 0, rad = 110;
  FX.ring(h.x, GY, 8, rad, 0.4, rage ? '255,210,90' : '255,140,50', 6);
  FX.dust(h.x, GY, 12, 40); FX.debris(h.x, GY, 10);
  FX.embers(h.x, GY - 6, 14, 'orange', 30);
  FX.shake(7, 0.3); FX.stop(0.07);
  Sfx.play('boom', 0.8);
  vibrate(30);
  let hits = 0;
  for (const e of W.enemies) {
    if (!canHit(e)) continue;
    const dx = e.x - h.x;
    if (Math.abs(dx) < rad + e.w / 2 && e.y > GY - 80) {
      const res = damageEnemy(e, { dmg: ATTACKS.slam.dmg * h.dmgMult * (rage ? 1.6 : 1), kbx: Math.sign(dx || 1) * 220, kby: -380, launch: true, heavy: true, breaks: true, dir: Math.sign(dx || 1), x: e.x, y: e.y - 10, src: h }, W);
      if (res && res !== 'block') { hits++; FX.blood(e.x, e.y - e.h / 2, 6); }
    }
  }
  if (hits) {
    h.combo += hits; h.comboT = 2.4; Game.stats.maxCombo = Math.max(Game.stats.maxCombo, h.combo);
    if (!rage) h.rage = Math.min(100, h.rage + 3 * hits * h.rageFill);
  }
}

function activateRage(h, W) {
  use(h, 'rage');
  h.rageT = h.rageMax; h.rage = 100;
  Sfx.play('rage');
  FX.ring(h.x, h.y - 30, 10, 170, 0.55, '255,120,40', 9);
  FX.ring(h.x, h.y - 30, 6, 110, 0.4, '255,220,140', 4);
  FX.embers(h.x, h.y - 30, 30, 'orange', 20);
  FX.shake(8, 0.45); FX.flashScreen('255,90,20', 0.55); FX.stop(0.12);
  vibrate(120);
  for (const e of W.enemies) {
    if (!canHit(e)) continue;
    const dx = e.x - h.x;
    if (Math.abs(dx) < 160) damageEnemy(e, { dmg: 12, kbx: Math.sign(dx || 1) * 320, kby: -260, launch: true, heavy: true, breaks: true, dir: Math.sign(dx || 1), src: h }, W);
  }
}

function heroTakeHit(h, dmg, kbx, kby, W, big) {
  if (h.state === 'dead' || W.cinematic) return false;
  if (h.state === 'dodge' && h.t < 0.2 && h.perfectT <= 0) {
    // esquiva perfecta: cámara lenta un instante
    h.perfectT = 3;
    FX.slow(0.35, 0.7); FX.text(h.x, h.y - 70, 'ESQUIVA PERFECTA', '#bfe3ff', 11, 1);
    FX.ring(h.x, h.y - 30, 6, 60, 0.35, '170,210,255', 3);
    return false;
  }
  if (h.inv > 0 || h.state === 'finisher') return false;
  const rage = h.rageT > 0;
  dmg *= Game.diff.dmg * (rage ? 0.5 : 1);
  h.hp -= dmg; h.flash = 0.18; h.combo = 0; h.comboT = 0;
  if (!rage) h.rage = Math.min(100, h.rage + dmg * 0.6 * h.rageFill);
  Sfx.play('hurt');
  FX.blood(h.x, h.y - 34, 8, Math.sign(kbx || 1));
  FX.shake(big ? 8 : 4.5, 0.25); FX.flashScreen('170,0,0', 0.3);
  vibrate(big ? 90 : 45);
  h.inv = 0.75;
  if (h.hp <= 0) {
    h.hp = 0; h.state = 'dead'; h.t = 0; h.rageT = 0;
    h.vx = kbx * 0.8; h.vy = -220; h.onGround = false;
    Sfx.play('death'); FX.slow(0.3, 1.4);
    return true;
  }
  if (!rage || big) {
    h.state = 'hurt'; h.t = 0; h.vx = kbx; h.vy = kby;
    if (kby < 0) h.onGround = false;
  }
  return true;
}

/* ---------- Remates ---------- */
function findFinishTarget(h, W) {
  let best = null, bd = 1e9;
  for (const e of W.enemies) {
    if (!e.alive || e.finishable <= 0) continue;
    const dx = Math.abs(e.x - h.x), reach = e.T.big ? 95 : 64;
    if (dx < reach && Math.abs((e.y - e.h / 2) - (h.y - 30)) < 90 && dx < bd) { best = e; bd = dx; }
  }
  return best;
}

function startFinisher(h, e, W) {
  h.state = 'finisher'; h.t = 0; h.vx = 0; h.vy = 0;
  h.face = Math.sign(e.x - h.x) || h.face;
  h.fin = { e, big: !!e.T.big, dur: e.T.big ? 1.55 : 0.85, hits: 0, sx: h.x, sy: h.y };
  h.inv = 99;
  e.state = 'grabbed'; e.t = 0; e.finishable = 0; e.vx = 0; e.vy = 0;
  W.zoom = 1.18;
  FX.slow(0.55, h.fin.dur * 0.9);
  Sfx.play('swingHeavy');
}

function finisherUpdate(h, dt, W) {
  const F = h.fin, e = F.e, t = h.t;
  const hitAt = F.big ? [0.45, 0.72, 0.98] : [0.3, 0.56];
  if (!F.big) {
    e.x = lerp(e.x, h.x + h.face * 24, 0.35);
    e.y = lerp(e.y, GY - 16, 0.25);
    e.face = -h.face;
  } else {
    // salta sobre la cabeza de la bestia
    const p = clamp(t / 0.32, 0, 1);
    const tx = e.x - h.face * 4, ty = e.y - e.h * 0.86;
    if (t < 1.2) { h.x = lerp(F.sx, tx, easeOut(p)); h.y = lerp(F.sy, ty, easeOut(p)) - Math.sin(p * Math.PI) * 30; }
    else { const q = clamp((t - 1.2) / 0.32, 0, 1); h.x = lerp(tx, tx - h.face * 60, q); h.y = lerp(ty, GY, easeIn(q)) - Math.sin(q * Math.PI) * 40; }
  }
  while (F.hits < hitAt.length && t >= hitAt[F.hits]) {
    F.hits++;
    const last = F.hits === hitAt.length;
    const px = F.big ? e.x + e.face * 14 : e.x, py = F.big ? e.y - e.h * 0.8 : e.y - e.h * 0.55;
    FX.blood(px, py, last ? 26 : 12, h.face); FX.spark(px, py, 6, h.face);
    FX.shake(last ? 9 : 4, 0.25); FX.stop(last ? 0.12 : 0.06);
    Sfx.play(last ? 'hitHeavy' : 'hit');
    vibrate(last ? 80 : 25);
    if (last) {
      killEnemy(e, W, { kbx: h.face * 120 }, true);
      FX.text(px, py - 20, pick(['¡BRUTAL!', '¡DESPIADADO!', '¡SIN PIEDAD!']), '#ff4a3a', 15, 1.1);
      h.combo++; h.comboT = 2.4;
      if (h.rageT <= 0) h.rage = Math.min(100, h.rage + 15 * h.rageFill);
    }
  }
  if (t >= F.dur) {
    h.state = h.y < GY - 1 ? 'air' : 'idle'; h.inv = 0.35; h.fin = null; W.zoom = 1;
    h.vy = 0;
  }
}

/* ---- enemies.js ---- */
'use strict';
/* =========================================================
   Enemigos: legionarios, hoplitas, arpías, arqueros, el
   minotauro y Polifemo. También proyectiles y orbes.
   ========================================================= */
let enemyUid = 0;

function makeEnemy(type, x, opts = {}) {
  const T = ENEMIES[type];
  const hp = T.hp * Game.diff.hp * (opts.hpMul || 1);
  const e = {
    type, T, x, y: GY, vx: 0, vy: 0, face: -1, hp, hpMax: hp, w: T.w, h: T.h,
    state: 'spawn', t: 0, onGround: true, flash: 0, alive: true, dead: false,
    finishable: 0, cool: rand(0.7, 1.6), anim: rand(0, 10), poiseDmg: 0, guard: 0,
    id: ++enemyUid, hitHero: false, turnT: 0, side: chance(0.5) ? 1 : -1, phase: 1, spawnDur: 0.9,
  };
  if (T.fly) { e.y = -30; e.onGround = false; e.spawnDur = 0.9; }
  if (T.boss) { e.state = 'intro'; e.y = GY - 420; e.onGround = false; }
  return e;
}

function enemyBox(e) {
  if (e.type === 'ciclope') {
    const hh = e.state === 'kneel' || e.state === 'qte' ? 150 : 196;
    return { x: e.x - 38, y: e.y - hh, w: 76, h: hh };
  }
  if (e.state === 'down' || e.state === 'dazed') return { x: e.x - e.w / 2 - 6, y: e.y - e.h * 0.55, w: e.w + 12, h: e.h * 0.55 };
  return { x: e.x - e.w / 2, y: e.y - e.h, w: e.w, h: e.h };
}
// El ojo se calcula con la misma pose que se dibuja
function cyclopsEye(e) {
  const P = cyclopsPoseOf(e), S = P.S;
  const x = e.x + (P.head.x + 4.2 * S) * e.face, y = e.y + P.head.y - 1 * S;
  return { x: x - 17, y: y - 14, w: 34, h: 28 };
}
function canHit(e) {
  if (!e.alive || e.state === 'spawn' || e.state === 'grabbed' || e.state === 'intro') return false;
  if (e.T.boss && (e.state === 'qte' || e.state === 'dying')) return false;
  return true;
}

// Aplica un golpe del héroe. Devuelve 'block', 'crit', 'hit', 'kill' o null.
function damageEnemy(e, hit, W) {
  if (!canHit(e)) return null;
  const fromSide = hit.src ? Math.sign(hit.src.x - e.x) : -hit.dir;
  if (e.T.shield && !hit.breaks && e.onGround && fromSide === e.face &&
      !['hurt', 'air', 'down', 'stagger', 'bash', 'bashWind'].includes(e.state)) {
    e.guard++; e.vx = hit.dir * 50; e.blockT = 0.15;
    if (e.guard >= 3) { e.state = 'bashWind'; e.t = 0; e.guard = 0; }
    return 'block';
  }
  let dmg = hit.dmg, res = 'hit';
  if (e.type === 'ciclope' && hit.y != null && inRect(hit.x, hit.y, cyclopsEye(e), 8)) { dmg *= 1.7; res = 'crit'; }
  if (['dazed', 'kneel', 'stagger', 'smashRec'].includes(e.state)) dmg *= 1.25;
  e.hp -= dmg; e.flash = 0.1;
  if (e.T.big) {
    e.poiseDmg += dmg * (hit.heavy ? 1.6 : 1);
    if (e.T.boss) {
      if (e.hp <= 0) { e.hp = 0; bossQTE(e, W); return res; }
      const ph = e.hp > e.hpMax * 0.66 ? 1 : e.hp > e.hpMax * 0.33 ? 2 : 3;
      if (ph > e.phase) { e.phase = ph; e.state = 'roar'; e.t = 0; e.poiseDmg = 0; return res; }
      if (e.poiseDmg >= e.T.poise && e.state !== 'kneel' && e.state !== 'roar') {
        e.poiseDmg = 0; e.state = 'kneel'; e.t = 0; FX.shake(8, 0.4); Sfx.play('stomp');
        FX.dust(e.x, GY, 14, 50);
      }
      return res;
    }
    if (e.hp <= 0) {
      if (e.state !== 'dazed') {
        e.state = 'dazed'; e.t = 0; e.finishable = 5; e.vx = hit.dir * 60;
        Game.hint('finish');
      } else if (e.hp < -e.hpMax * 0.15) killEnemy(e, W, hit);
      return res;
    }
    if (e.poiseDmg >= e.T.poise && e.state !== 'stagger') {
      e.poiseDmg = 0; e.state = 'stagger'; e.t = 0; e.vx = hit.dir * 120;
    }
    return res;
  }
  if (e.hp <= 0) { killEnemy(e, W, hit); return 'kill'; }
  // un ataque ya lanzado no se interrumpe con golpes ligeros: hay que esquivarlo
  const armored = (e.state === 'windup' && e.t > 0.18) || e.state === 'strike' || e.state === 'bash' || e.rageT > 0;
  if (armored && !hit.heavy && !hit.launch) return res;
  e.vx = hit.kbx / e.T.mass;
  if (e.T.fly && !hit.launch && !hit.heavy) {
    e.state = 'hurt'; e.t = 0; e.vy = hit.kby * 0.35;
  } else if (hit.launch || !e.onGround) {
    e.state = 'air'; e.t = 0; e.onGround = false;
    e.vy = hit.launch ? hit.kby / Math.sqrt(e.T.mass) : Math.min(e.vy * 0.3, hit.kby < -100 ? hit.kby : -170);
  } else {
    e.state = 'hurt'; e.t = 0;
    // tras varios golpes seguidos en el suelo, el enemigo se enfurece y contraataca
    e.hurtN = W.time - (e.lastHurt || -9) < 1.6 ? (e.hurtN || 0) + 1 : 1;
    e.lastHurt = W.time;
    if (e.hurtN >= 4 - Game.diffIdx && (e.type === 'legion' || e.type === 'hoplita')) {
      e.hurtN = 0; e.rageT = 1.1; e.vx *= 0.3;
      e.face = Math.sign(hit.src ? hit.src.x - e.x : -hit.dir) || e.face;
      go(e, 'windup'); e.t = 0.1;
    }
  }
  if (e.hp < e.hpMax * 0.35 && e.finishable <= 0 && (hit.heavy || chance(0.4))) { e.finishable = 2.4; Game.hint('finish'); }
  return res;
}

function killEnemy(e, W, hit, fin) {
  if (!e.alive) return;
  e.alive = false; e.dead = true; e.state = 'dead'; e.t = 0; e.finishable = 0;
  e.vx = ((hit && hit.kbx) || 0) / Math.min(e.T.mass, 3) * 0.8;
  e.vy = e.onGround ? -140 : Math.min(e.vy, -80);
  if (e.T.fly) e.vy = 40;
  e.onGround = false;
  Sfx.play('enemyDie');
  FX.blood(e.x, e.y - e.h / 2, fin ? 22 : 12);
  spawnOrbs(W, e.x, e.y - e.h / 2, 'red', e.T.orbs * (fin ? 2 : 1));
  if (fin || chance(0.22)) spawnOrbs(W, e.x, e.y - e.h / 2, 'green', fin ? (e.T.big ? 30 : 15) : 8);
  if (fin) spawnOrbs(W, e.x, e.y - e.h / 2, 'gold', e.T.big ? 30 : 12);
  Game.stats.kills++;
}

function spawnOrbs(W, x, y, kind, total) {
  const per = kind === 'red' ? 5 : kind === 'green' ? 5 : 6;
  const n = clamp(Math.round(total / per), 1, 14);
  for (let i = 0; i < n; i++) {
    const a = rand(-Math.PI * 0.9, -Math.PI * 0.1), sp = rand(80, 240);
    W.orbs.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, k: kind, v: total / n, t: 0 });
  }
}

function updateOrbs(W, h, dt) {
  for (let i = W.orbs.length - 1; i >= 0; i--) {
    const o = W.orbs[i];
    o.t += dt;
    if (o.t > 0.45 && h.state !== 'dead') {
      const dx = h.x - o.x, dy = (h.y - 30) - o.y, d = Math.hypot(dx, dy) || 1;
      const sp = 260 + o.t * 500;
      o.vx = lerp(o.vx, dx / d * sp, 0.15); o.vy = lerp(o.vy, dy / d * sp, 0.15);
      if (d < 16) {
        W.orbs.splice(i, 1);
        if (o.k === 'red') { Game.addOrbs(o.v); Sfx.play('orb'); }
        else if (o.k === 'green') { h.hp = Math.min(h.hpMax, h.hp + o.v); Sfx.play('heal'); }
        else { if (h.rageT <= 0) h.rage = Math.min(100, h.rage + o.v); Sfx.play('orb'); }
        continue;
      }
    } else {
      o.vy += 600 * dt; o.vx *= 0.98;
      if (o.y > GY - 4) { o.y = GY - 4; o.vy *= -0.5; }
    }
    o.x += o.vx * dt; o.y += o.vy * dt;
  }
}

/* ---------- Proyectiles ---------- */
function updateProjs(W, h, dt) {
  for (let i = W.projs.length - 1; i >= 0; i--) {
    const p = W.projs[i];
    p.t = (p.t || 0) + dt;
    if (p.dead) { W.projs.splice(i, 1); continue; }
    if (p.k === 'arrow') {
      p.vy += 200 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (inRect(p.x, p.y, heroBox(h), 3)) {
        if (heroTakeHit(h, p.dmg, Math.sign(p.vx) * 120, -80, W)) p.dead = true;
      }
      if (p.y > GY || p.t > 3) { p.dead = true; FX.spark(p.x, GY, 3, 0, 'white'); }
    } else if (p.k === 'rock') {
      p.vy += 700 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot = (p.rot || 0) + dt * 6;
      if (Math.hypot(h.x - p.x, h.y - 30 - p.y) < 22) { heroTakeHit(h, p.dmg, Math.sign(p.vx) * 220, -200, W, true); p.dead = true; }
      if (p.y >= GY - 10) {
        p.dead = true;
        FX.debris(p.x, GY, 14, '#4a3b30'); FX.dust(p.x, GY, 10, 24); FX.shake(5, 0.2); Sfx.play('stomp', 0.8);
        if (Math.abs(h.x - p.x) < 44 && h.y > GY - 40) heroTakeHit(h, p.dmg * 0.6, Math.sign(h.x - p.x) * 200, -180, W);
      }
    } else if (p.k === 'wave') {
      const step = p.vx * dt;
      p.x += step; p.dist += Math.abs(step);
      if (chance(0.7)) FX.dust(p.x, GY, 1, 6, '140,110,80');
      if (chance(0.5)) FX.embers(p.x, GY - 4, 1, 'orange', 6);
      if (!p.hit && Math.abs(h.x - p.x) < 16 && h.y > GY - p.hgt) {
        if (heroTakeHit(h, p.dmg, Math.sign(p.vx) * 200, -240, W)) p.hit = true;
      }
      if (p.dist > p.max || p.x < W.bounds.l || p.x > W.bounds.r) p.dead = true;
    }
  }
}

/* ---------- IA ---------- */
function attackBox(e, x0, x1, y0, y1) {
  return e.face > 0 ? { x: e.x + x0, y: e.y + y0, w: x1 - x0, h: y1 - y0 } : { x: e.x - x1, y: e.y + y0, w: x1 - x0, h: y1 - y0 };
}
function tryHitHero(e, box, dmg, kbx, kby, W, big) {
  if (e.hitHero) return;
  const h = W.hero;
  if (overlap(box, heroBox(h))) { if (heroTakeHit(h, dmg, kbx, kby, W, big)) e.hitHero = true; }
}
function go(e, state) { e.state = state; e.t = 0; e.hitHero = false; }

function updateEnemies(W, dt) {
  const h = W.hero;
  let attackers = 0;
  for (const e of W.enemies) if (e.alive && /Wind|strike|swing|dive|screech|charge|bash|aim/.test(e.state)) attackers++;
  W.attackers = attackers;
  for (const e of W.enemies) updateEnemy(e, W, dt, h);
  // separación entre enemigos de suelo
  const g = W.enemies.filter(e => e.alive && !e.T.fly && !e.T.boss && e.state !== 'grabbed');
  for (let i = 0; i < g.length; i++) for (let j = i + 1; j < g.length; j++) {
    const a = g[i], b = g[j], dx = b.x - a.x, min = (a.w + b.w) * 0.42;
    if (Math.abs(dx) < min && Math.abs(a.y - b.y) < 40) {
      const push = (min - Math.abs(dx)) * 0.5 * Math.min(1, dt * 10) * (dx >= 0 ? 1 : -1);
      a.x -= push; b.x += push;
    }
  }
  for (let i = W.enemies.length - 1; i >= 0; i--) if (W.enemies[i].remove) W.enemies.splice(i, 1);
}

function canStartAttack(W) { return W.attackers < (Game.diffIdx === 2 ? 3 : 2) && W.hero.state !== 'dead'; }

function enemyPhysics(e, W, dt, grav = 1300) {
  if (!e.onGround) e.vy += grav * dt;
  e.x += e.vx * dt; e.y += e.vy * dt;
  if (e.y >= GY) {
    const impact = e.vy;
    e.y = GY; e.vy = 0;
    if (!e.onGround) { e.onGround = true; e.landed = impact; }
  } else if (e.y < GY - 0.5) e.onGround = false;
  // la IA controla la velocidad al caminar; el rozamiento frena el resto (empujones, caídas…)
  if (e.onGround && !/walk|charge|strike|bash/.test(e.state)) e.vx = approach(e.vx, 0, 700 * dt);
  const m = e.w / 2 + 4;
  e.x = clamp(e.x, W.bounds.l + m, W.bounds.r - m);
}

// Estados de reacción comunes a los enemigos pequeños
function reactStates(e, W, dt) {
  switch (e.state) {
    case 'hurt':
      if (e.T.fly) { e.vx *= 0.9; e.vy *= 0.9; e.x += e.vx * dt; e.y += e.vy * dt; e.y = Math.min(e.y, GY - 20); if (e.t > 0.3) go(e, 'hover'); return true; }
      enemyPhysics(e, W, dt);
      if (e.t > 0.32) { go(e, 'walk'); e.cool = Math.max(e.cool, 0.35); }
      return true;
    case 'air':
      e.landed = 0;
      enemyPhysics(e, W, dt, e.vy < 0 ? 1300 : 1050);
      if (e.onGround && e.t > 0.05) {
        if (e.landed > 250) { FX.dust(e.x, GY, 4, 10); Sfx.play('land'); }
        go(e, 'down');
      }
      return true;
    case 'down':
      enemyPhysics(e, W, dt);
      if (e.t > (e.T.fly ? 1.2 : 0.7)) { go(e, e.T.fly ? 'rise' : 'walk'); e.cool = Math.max(e.cool, 0.5); }
      return true;
    case 'grabbed':
      return true;
    case 'dead':
      e.landed = 0;
      enemyPhysics(e, W, dt);
      if (e.onGround && e.t > 0.5) {
        if (!e.ashed) { e.ashed = true; FX.ash(e.x, e.y, e.w * 1.6, e.h * 0.4, e.T.big ? 40 : 18); }
        if (e.t > 1.4) e.remove = true;
      }
      if (e.t > 3) e.remove = true;
      return true;
  }
  return false;
}

function updateEnemy(e, W, dt, h) {
  e.t += dt; e.anim += dt;
  if (e.flash > 0) e.flash -= dt;
  if (e.blockT > 0) e.blockT -= dt;
  if (e.rageT > 0) e.rageT -= dt;
  if (e.finishable > 0 && e.state !== 'dazed') e.finishable -= dt;
  if (e.state === 'spawn') {
    if (e.T.fly) { e.y = lerp(-30, GY - 110, easeOut(clamp(e.t / e.spawnDur, 0, 1))); }
    else if (e.t < 0.05) { FX.dust(e.x, GY, 6, 14, '70,55,45'); Sfx.play('spawn'); }
    else if (chance(0.3)) FX.dust(e.x, GY, 1, 12, '70,55,45');
    if (e.t >= e.spawnDur) go(e, e.T.fly ? 'hover' : 'walk');
    return;
  }
  if (e.state === 'grabbed') return;
  if (e.T.boss) { updateBoss(e, W, dt, h); return; }
  if (reactStates(e, W, dt)) return;
  const dx = h.x - e.x, adx = Math.abs(dx);
  AI[e.type](e, W, dt, h, dx, adx);
}

const AI = {
  legion(e, W, dt, h, dx, adx) {
    switch (e.state) {
      case 'walk':
        e.face = Math.sign(dx) || e.face;
        e.cool -= dt;
        if (adx > 38) e.vx = approach(e.vx, e.face * e.T.speed * (e.finishable > 0 ? 0.4 : 1), 500 * dt);
        else e.vx = approach(e.vx, 0, 700 * dt);
        if (adx < 54 && e.cool <= 0 && canStartAttack(W) && e.finishable <= 0 && Math.abs(h.y - e.y) < 50) { go(e, 'windup'); W.attackers++; }
        break;
      case 'windup':
        e.vx = approach(e.vx, 0, 600 * dt);
        if (e.t > 0.5) { go(e, 'strike'); e.vx = e.face * 100; Sfx.play('swing'); }
        break;
      case 'strike':
        if (e.t < 0.14) tryHitHero(e, attackBox(e, 0, 50, -46, -6), e.T.dmg, e.face * 170, -120, W);
        if (e.t > 0.2) go(e, 'recover');
        break;
      case 'recover':
        if (e.t > 0.55) { go(e, 'walk'); e.cool = rand(1.0, 2.2); }
        break;
    }
    enemyPhysics(e, W, dt);
  },
  hoplita(e, W, dt, h, dx, adx) {
    switch (e.state) {
      case 'walk': {
        // gira el escudo con retraso: rodar por detrás funciona
        const want = Math.sign(dx) || e.face;
        if (want !== e.face) { e.turnT += dt; if (e.turnT > 0.4) { e.face = want; e.turnT = 0; } } else e.turnT = 0;
        e.cool -= dt;
        if (adx > 54) e.vx = approach(e.vx, Math.sign(dx) * e.T.speed, 400 * dt);
        else e.vx = approach(e.vx, 0, 700 * dt);
        if (adx < 66 && e.cool <= 0 && canStartAttack(W) && want === e.face && Math.abs(h.y - e.y) < 50) { go(e, 'windup'); W.attackers++; }
        break;
      }
      case 'windup':
        e.vx = approach(e.vx, 0, 600 * dt);
        if (e.t > 0.55) { go(e, 'strike'); e.vx = e.face * 140; Sfx.play('swing'); }
        break;
      case 'strike':
        if (e.t < 0.14) tryHitHero(e, attackBox(e, 8, 70, -42, -24), e.T.dmg, e.face * 200, -100, W);
        if (e.t > 0.22) go(e, 'recover');
        break;
      case 'bashWind':
        e.face = Math.sign(dx) || e.face;
        if (e.t > 0.25) { go(e, 'bash'); e.vx = e.face * 260; Sfx.play('swingHeavy'); }
        break;
      case 'bash':
        tryHitHero(e, attackBox(e, 0, 34, -52, 0), 8, e.face * 330, -160, W);
        if (e.t > 0.22) go(e, 'recover');
        break;
      case 'recover':
        if (e.t > 0.6) { go(e, 'walk'); e.cool = rand(1.1, 2.3); }
        break;
    }
    enemyPhysics(e, W, dt);
  },
  arpia(e, W, dt, h, dx, adx) {
    switch (e.state) {
      case 'hover': {
        e.face = Math.sign(dx) || e.face;
        const tx = h.x - e.side * 95, ty = GY - 112 + Math.sin(e.anim * 2.6) * 10;
        e.vx = lerp(e.vx, clamp((tx - e.x) * 2.2, -e.T.speed, e.T.speed), 0.08);
        e.vy = lerp(e.vy, clamp((ty - e.y) * 2.2, -e.T.speed, e.T.speed), 0.08);
        e.x += e.vx * dt; e.y += e.vy * dt;
        e.cool -= dt;
        if (e.cool <= 0 && canStartAttack(W) && adx < 220) { go(e, 'screech'); W.attackers++; Sfx.play('screech'); }
        break;
      }
      case 'screech':
        e.face = Math.sign(dx) || e.face;
        e.vx *= 0.9; e.vy = Math.sin(e.t * 40) * 30;
        e.x += e.vx * dt; e.y += e.vy * dt;
        if (e.t > 0.5) {
          go(e, 'dive');
          const tx = h.x, ty = h.y - 26, d = Math.hypot(tx - e.x, ty - e.y) || 1;
          e.vx = (tx - e.x) / d * 380; e.vy = (ty - e.y) / d * 380;
        }
        break;
      case 'dive':
        e.x += e.vx * dt; e.y += e.vy * dt;
        tryHitHero(e, { x: e.x - 13, y: e.y - 24, w: 26, h: 24 }, e.T.dmg, Math.sign(e.vx) * 180, -100, W);
        if (e.y >= GY - 4 || e.t > 1.1 || e.hitHero) { e.y = Math.min(e.y, GY - 4); go(e, 'rise'); }
        break;
      case 'rise':
        e.vy = lerp(e.vy, -170, 0.1); e.vx *= 0.96;
        e.x += e.vx * dt; e.y += e.vy * dt;
        if (e.y <= GY - 105 || e.t > 1.6) { go(e, 'hover'); e.cool = rand(1.6, 3.2); e.side = -e.side; }
        break;
    }
    const m = e.w / 2;
    e.x = clamp(e.x, W.bounds.l + m, W.bounds.r - m);
    e.y = clamp(e.y, 20, GY);
    e.onGround = false;
  },
  arquero(e, W, dt, h, dx, adx) {
    switch (e.state) {
      case 'walk': {
        e.face = Math.sign(dx) || e.face;
        e.cool -= dt;
        const nearWall = (e.x - W.bounds.l < 50 && dx > 0) || (W.bounds.r - e.x < 50 && dx < 0);
        let v = 0;
        if (adx < 150 && !nearWall) v = -e.face * e.T.speed;
        else if (adx > 300) v = e.face * e.T.speed;
        e.vx = approach(e.vx, v, 500 * dt);
        if (e.cool <= 0 && adx < 460) { go(e, 'aim'); Sfx.play('ui'); }
        break;
      }
      case 'aim':
        e.face = Math.sign(dx) || e.face;
        if (e.t > 0.8) {
          const sx = e.x + e.face * 14, sy = e.y - 38, tx = h.x, ty = h.y - 30;
          const sp = 390, time = Math.max(0.15, Math.abs(tx - sx) / sp);
          W.projs.push({ k: 'arrow', x: sx, y: sy, vx: Math.sign(tx - sx || e.face) * sp, vy: (ty - sy) / time - 100 * time, dmg: e.T.dmg });
          Sfx.play('arrow');
          go(e, 'recover');
        }
        break;
      case 'recover':
        if (e.t > 0.5) { go(e, 'walk'); e.cool = rand(1.8, 3); }
        break;
    }
    enemyPhysics(e, W, dt);
  },
  minotauro(e, W, dt, h, dx, adx) {
    switch (e.state) {
      case 'walk': {
        const want = Math.sign(dx) || e.face;
        if (want !== e.face) { e.turnT += dt; if (e.turnT > 0.3) { e.face = want; e.turnT = 0; } } else e.turnT = 0;
        if (adx > 72) e.vx = approach(e.vx, want * e.T.speed, 300 * dt);
        else e.vx = approach(e.vx, 0, 700 * dt);
        e.cool -= dt;
        if (e.cool <= 0 && want === e.face && h.state !== 'dead') {
          if (adx > 170 && chance(0.65)) { go(e, 'chargeWind'); Sfx.play('bull'); }
          else if (adx < 100) go(e, chance(0.6) ? 'swingWind' : 'slamWind');
          else if (adx < 260) go(e, 'slamWind');
        }
        break;
      }
      case 'swingWind':
        if (e.t > 0.65) { go(e, 'swing'); Sfx.play('swingHeavy'); e.vx = e.face * 80; }
        break;
      case 'swing':
        if (e.t < 0.2) tryHitHero(e, attackBox(e, 6, 92, -84, -8), e.T.dmg, e.face * 280, -220, W, true);
        if (e.t > 0.25) go(e, 'recover');
        break;
      case 'slamWind':
        if (e.t > 0.8) {
          go(e, 'slam');
          tryHitHero(e, attackBox(e, 20, 92, -44, 0), e.T.dmg, e.face * 220, -260, W, true);
          W.projs.push({ k: 'wave', x: e.x + e.face * 70, vx: e.face * 300, dist: 0, max: 300, dmg: 14, hgt: 22 });
          FX.shake(6, 0.3); FX.dust(e.x + e.face * 60, GY, 10, 20); FX.debris(e.x + e.face * 60, GY, 8); Sfx.play('stomp');
        }
        break;
      case 'slam':
        if (e.t > 0.8) go(e, 'recover');
        break;
      case 'chargeWind':
        e.vx = 0;
        if (chance(0.4)) FX.dust(e.x - e.face * 14, GY, 1, 6);
        if (e.t > 0.85) go(e, 'charge');
        break;
      case 'charge': {
        e.vx = e.face * 350;
        if (chance(0.6)) FX.dust(e.x - e.face * 18, GY, 1, 8);
        tryHitHero(e, { x: e.x - 26, y: e.y - 72, w: 52, h: 72 }, e.T.dmg + 4, e.face * 400, -240, W, true);
        const passed = (h.x - e.x) * e.face < -150;
        const wall = (e.face > 0 && e.x > W.bounds.r - 40) || (e.face < 0 && e.x < W.bounds.l + 40);
        if (e.t > 1.5 || passed || wall) {
          go(e, 'recover'); e.vx = e.face * 120;
          if (wall) { FX.shake(7, 0.3); Sfx.play('stomp'); FX.debris(e.x + e.face * 20, GY - 40, 10); }
        }
        break;
      }
      case 'recover':
        if (e.t > 0.9) { go(e, 'walk'); e.cool = rand(0.6, 1.4); }
        break;
      case 'stagger':
        if (e.t > 1.3) { go(e, 'walk'); e.cool = 0.4; }
        break;
      case 'dazed':
        e.finishable = 5 - e.t;
        if (chance(0.1)) FX.embers(e.x, e.y - e.h, 1, 'gold', 14);
        if (e.t > 5) killEnemy(e, W, { kbx: 0 });
        break;
    }
    enemyPhysics(e, W, dt);
  },
};

/* ---------- Polifemo, el Cíclope ---------- */
function bossQTE(e, W) {
  go(e, 'qte');
  e.vx = 0;
  W.qte = { e, prog: 0.15, t: 0, dur: 5.5 };
  W.zoom = 1.12;
  FX.shake(10, 0.6); Sfx.play('roar');
  FX.slow(0.5, 0.6);
}

function updateBoss(e, W, dt, h) {
  const dx = h.x - e.x, adx = Math.abs(dx);
  const speed = e.phase === 3 ? 0.8 : 1;   // fase 3: más rápido
  const wind = s => s * speed;
  switch (e.state) {
    case 'intro':
      if (!e.onGround) {
        e.vy += 1200 * dt; e.y += e.vy * dt;
        if (e.y >= GY) {
          e.y = GY; e.onGround = true; e.t = 0; e.landedIntro = true;
          FX.shake(14, 0.8); FX.dust(e.x, GY, 30, 80); FX.debris(e.x, GY, 22); Sfx.play('boom', 1.2);
          vibrate(150);
          if (Math.abs(h.x - e.x) < 120) heroTakeHit(h, 10, Math.sign(h.x - e.x || -1) * 300, -250, W);
        }
        return;
      }
      if (e.t > 0.5 && !e.roared) { e.roared = true; Sfx.play('roar'); FX.shake(9, 1.4); FX.ring(e.x, e.y - 170, 10, 220, 0.9, '255,200,150', 5); }
      if (e.t > 2.2) { go(e, 'idle'); e.cool = 1; W.cinematic = false; }
      return;
    case 'idle': {
      const want = Math.sign(dx) || e.face;
      if (want !== e.face) { e.turnT += dt; if (e.turnT > 0.55) { e.face = want; e.turnT = 0; } } else e.turnT = 0;
      e.cool -= dt;
      if (adx > 140) {
        e.vx = want * e.T.speed * (e.phase === 3 ? 1.4 : 1);
        if (Math.floor(e.anim * 2.2) !== Math.floor((e.anim - dt) * 2.2)) { Sfx.play('stomp', 0.35); FX.shake(2, 0.12); FX.dust(e.x, GY, 3, 30); }
      } else e.vx = 0;
      if (e.cool <= 0 && h.state !== 'dead') {
        let opts;
        if (adx < 100) opts = ['stompWind', 'sweepWind', 'stompWind'];
        else if (adx < 230) opts = ['smashWind', 'sweepWind', 'smashWind'];
        else opts = e.phase >= 2 ? ['rockWind', 'smashWind', 'rockWind'] : ['smashWind'];
        if (want !== e.face && adx < 100) opts = ['stompWind'];
        if (adx < 420 || e.phase >= 2) { go(e, pick(opts)); e.vx = 0; }
      }
      break;
    }
    case 'smashWind':
      if (e.t > wind(0.95)) {
        go(e, 'smash');
        tryHitHero(e, attackBox(e, 40, 178, -72, 0), e.T.dmg + 2, e.face * 300, -300, W, true);
        W.projs.push({ k: 'wave', x: e.x + e.face * 150, vx: e.face * 330, dist: 0, max: 460, dmg: 16, hgt: 24 });
        FX.shake(11, 0.4); FX.debris(e.x + e.face * 130, GY, 16); FX.dust(e.x + e.face * 130, GY, 16, 40);
        Sfx.play('boom'); vibrate(60);
      }
      break;
    case 'smash':
      if (e.t > 0.1) go(e, 'smashRec');
      break;
    case 'smashRec':
      if (e.t > wind(1.1)) { go(e, 'idle'); e.cool = rand(0.5, 1.1) * speed; }
      break;
    case 'sweepWind':
      if (e.t > wind(0.8)) { go(e, 'sweep'); Sfx.play('swingHeavy'); }
      break;
    case 'sweep':
      tryHitHero(e, attackBox(e, -40, 205, -46, 0), e.T.dmg - 4, e.face * 360, -200, W, true);
      if (e.t > 0.26) go(e, 'sweepRec');
      break;
    case 'sweepRec':
      if (e.t > wind(0.65)) { go(e, 'idle'); e.cool = rand(0.5, 1.1) * speed; }
      break;
    case 'stompWind':
      if (e.t > wind(0.6)) {
        go(e, 'stomp');
        const box = { x: e.x - 105, y: GY - 34, w: 210, h: 34 };
        if (overlap(box, heroBox(h))) heroTakeHit(h, e.T.dmg - 6, Math.sign(dx || 1) * 320, -260, W, true);
        FX.shake(9, 0.35); FX.dust(e.x, GY, 18, 60); FX.ring(e.x, GY, 10, 120, 0.4, '200,160,120', 5);
        Sfx.play('boom', 0.8);
      }
      break;
    case 'stomp':
      if (e.t > wind(0.55)) { go(e, 'idle'); e.cool = rand(0.4, 1) * speed; }
      break;
    case 'rockWind':
      if (e.t > wind(0.9)) {
        go(e, 'rockRec');
        const sx = e.x + e.face * 30, sy = e.y - 196, T = 1.05;
        W.projs.push({ k: 'rock', x: sx, y: sy, vx: (h.x - sx) / T, vy: (GY - 10 - sy) / T - 0.5 * 700 * T, dmg: 20 });
        Sfx.play('swingHeavy');
      }
      break;
    case 'rockRec':
      if (e.t > wind(0.7)) { go(e, 'idle'); e.cool = rand(0.4, 0.9) * speed; }
      break;
    case 'roar':
      if (e.t > 0.35 && !e.roarDone) {
        e.roarDone = true;
        Sfx.play('roar'); FX.shake(10, 1.2); FX.ring(e.x, e.y - 170, 10, 240, 0.9, '255,190,140', 6);
        if (adx < 170) heroTakeHit(h, 0.01, Math.sign(dx || 1) * 380, -200, W);
        Game.summon(e.phase === 2 ? [['legion', 3]] : [['legion', 2], ['arpia', 2]]);
      }
      if (e.t > 1.8) { go(e, 'idle'); e.roarDone = false; e.cool = 1.2; }
      break;
    case 'kneel':
      e.vx = 0;
      if (chance(0.15)) FX.embers(e.x + e.face * 14, e.y - 130, 1, 'gold', 16);
      if (e.t > 2.8) { go(e, 'idle'); e.cool = 0.4; }
      break;
    case 'qte':
      if (chance(0.15)) FX.embers(e.x + e.face * 14, e.y - 132, 1, 'gold', 14);
      break;
    case 'dying':
      if (chance(0.4)) FX.blood(e.x + e.face * 14, e.y - 170 + e.t * 40, 2);
      if (e.t > 1.6 && !e.fell) {
        e.fell = true; FX.shake(16, 1.2); FX.dust(e.x, GY, 40, 120); FX.debris(e.x, GY, 26); Sfx.play('boom', 1.3); vibrate(250);
      }
      break;
  }
  if (e.state !== 'intro') {
    e.x += e.vx * dt;
    const m = 50;
    e.x = clamp(e.x, W.bounds.l + m, W.bounds.r - m);
  }
}

/* ---- chars.js ---- */
'use strict';
/* =========================================================
   Personajes dibujados por código con un esqueleto sencillo
   (IK de dos huesos para brazos y piernas)
   ========================================================= */
let TINT = null;                       // color de destello al recibir un golpe
const K = col => TINT || col;

function pose(S, o) {
  const lean = o.lean || 0, cr = o.crouch || 0;
  const hip = { x: (o.hx || 0) * S, y: (-28 + cr * 5 + (o.bob || 0)) * S };
  const tl = (o.torso || 22) * S;
  const neck = { x: hip.x + Math.sin(lean) * tl, y: hip.y - Math.cos(lean) * tl };
  const hl = lean + (o.headTilt || 0);
  const head = { x: neck.x + Math.sin(hl) * 7.5 * S, y: neck.y - Math.cos(hl) * 7.5 * S };
  const sh = { x: neck.x - Math.sin(lean) * 2.5 * S, y: neck.y + Math.cos(lean) * 2.5 * S };
  const fR = { x: (o.fR ? o.fR[0] : 7) * S, y: (o.fR ? o.fR[1] : 0) * S };
  const fL = { x: (o.fL ? o.fL[0] : -6) * S, y: (o.fL ? o.fL[1] : 0) * S };
  const lg = o.leg || [15, 14], ar = o.arm || [11, 11];
  const kR = ik(hip.x, hip.y, fR.x, fR.y, lg[0] * S, lg[1] * S, -1);
  const kL = ik(hip.x, hip.y, fL.x, fL.y, lg[0] * S, lg[1] * S, -1);
  const dR = (o.dR == null ? 16 : o.dR) * S, dL = (o.dL == null ? 16 : o.dL) * S;
  const hR = { x: sh.x + Math.cos(o.aR) * dR, y: sh.y + Math.sin(o.aR) * dR };
  const hL = { x: sh.x + Math.cos(o.aL) * dL, y: sh.y + Math.sin(o.aL) * dL };
  const eR = ik(sh.x, sh.y, hR.x, hR.y, ar[0] * S, ar[1] * S, o.bendR || 1);
  const eL = ik(sh.x, sh.y, hL.x, hL.y, ar[0] * S, ar[1] * S, o.bendL || 1);
  return { hip, neck, head, sh, fR, fL, kR, kL, hR, hL, eR, eL, S, lean };
}
function walkFeet(ph, stride, lift, base = [7, -6]) {
  return {
    fR: [base[0] * 0.3 + Math.sin(ph) * stride, -Math.max(0, Math.cos(ph)) * lift],
    fL: [base[1] * 0.3 + Math.sin(ph + Math.PI) * stride, -Math.max(0, Math.cos(ph + Math.PI)) * lift],
  };
}

function seg(c, a, b, w, col) { c.strokeStyle = K(col); c.lineWidth = w; c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke(); }
function limb(c, a, b, d, w1, w2, col) { seg(c, a, b, w1, col); seg(c, b, d, w2, col); }
function dot(c, p, r, col) { c.fillStyle = K(col); c.beginPath(); c.arc(p.x, p.y, r, 0, TAU); c.fill(); }
const mix = (a, b, t) => ({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) });
function torsoPts(P, wTop, wBot, ext = 0) {
  const ux = P.neck.x - P.hip.x, uy = P.neck.y - P.hip.y, l = Math.hypot(ux, uy) || 1;
  const u = { x: ux / l, y: uy / l }, n = { x: -u.y, y: u.x };
  const S = P.S;
  return {
    u, n,
    nf: { x: P.neck.x + n.x * wTop / 2 * S + u.x * ext * S, y: P.neck.y + n.y * wTop / 2 * S + u.y * ext * S },
    nb: { x: P.neck.x - n.x * wTop / 2 * S + u.x * ext * S, y: P.neck.y - n.y * wTop / 2 * S + u.y * ext * S },
    hb: { x: P.hip.x - n.x * wBot / 2 * S, y: P.hip.y - n.y * wBot / 2 * S },
    hf: { x: P.hip.x + n.x * wBot / 2 * S, y: P.hip.y + n.y * wBot / 2 * S },
  };
}
function poly(c, pts, col) {
  c.fillStyle = K(col); c.beginPath(); c.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
  c.closePath(); c.fill();
}

/* ---------- El Fantasma de Esparta ---------- */
const HC = { skin: '#e2dccf', shade: '#b5ad9f', tattoo: '#b3121a', beard: '#2a2320', skirt: '#6d1c15', skirtD: '#4a120d', gold: '#caa04a', bronze: '#9b7337', leather: '#4a3122' };

function heroPoseOf(h, bs) {
  const o = { aR: bs.R.a, aL: bs.L.a, dR: 15, dL: 15 };
  const reachArm = b => (b.reach > 20 ? 19 : 15);
  o.dR = reachArm(bs.R); o.dL = reachArm(bs.L);
  switch (h.state) {
    case 'idle': o.crouch = 0.6; o.lean = 0.08; o.bob = Math.sin(h.anim * 2.4) * 0.5; o.fR = [8, 0]; o.fL = [-7, 0]; break;
    case 'run': { const f = walkFeet(h.runPhase, 11, 7); Object.assign(o, f); o.lean = 0.24; o.bob = -Math.abs(Math.sin(h.runPhase)) * 1.6; break; }
    case 'air': o.fR = h.vy < 0 ? [6, -9] : [5, -2]; o.fL = h.vy < 0 ? [-4, -5] : [-6, -1]; o.lean = 0.1; break;
    case 'dodge': o.crouch = 2; o.fR = [5, -6]; o.fL = [-3, -4]; o.lean = 0.7; break;
    case 'hurt': o.lean = -0.35; o.fR = [11, 0]; o.fL = [-4, 0]; o.headTilt = -0.2; break;
    case 'dead': o.lean = -0.2; o.fR = [8, 0]; o.fL = [-5, 0]; break;
    case 'finisher': o.lean = 0.25; o.fR = [12, 0]; o.fL = [-8, 0]; o.crouch = 0.6; if (h.fin && h.fin.big && h.t < 1.2) { o.crouch = 1.6; o.fR = [6, -2]; o.fL = [-6, -2]; } break;
    case 'attack': {
      const A = ATTACKS[h.atk];
      if (h.atk === 'slam') { if (h.slamPhase < 2) { o.fR = [5, -9]; o.fL = [-4, -6]; o.lean = 0.2; } else { o.crouch = 2; o.lean = 0.55; o.fR = [12, 0]; o.fL = [-9, 0]; } break; }
      const p = clamp(h.t / A.dur, 0, 1);
      if (A.air) { o.fR = [6, -7]; o.fL = [-5, -4]; o.lean = A.multi ? 0 : 0.15; }
      else if (h.atk === 'h1') { o.crouch = h.t < A.act[0] ? 1.4 : 0.2; o.lean = h.t < A.act[0] ? 0.35 : -0.12; o.fR = [11, 0]; o.fL = [-8, 0]; }
      else if (A.multi) { o.lean = 0.05; o.crouch = 0.6; o.fR = [10, 0]; o.fL = [-9, 0]; }
      else { o.lean = 0.12 + Math.sin(p * Math.PI) * 0.2; o.crouch = 0.8; o.fR = [13, 0]; o.fL = [-9, 0]; }
      break;
    }
  }
  return pose(1, o);
}

function drawBlade(c, sh, hand, b, rage, far) {
  const dx = Math.cos(b.a), dy = Math.sin(b.a);
  let bx = hand.x, by = hand.y;
  if (b.reach > 20) {
    bx = sh.x + dx * (b.reach - 6); by = sh.y + dy * (b.reach - 6);
    c.strokeStyle = K(far ? '#4f4640' : '#71665d'); c.lineWidth = 1.5;
    c.setLineDash([2.2, 1.6]);
    c.beginPath(); c.moveTo(hand.x, hand.y); c.lineTo(bx, by); c.stroke();
    c.setLineDash([]);
  }
  c.save(); c.translate(bx, by); c.rotate(b.a);
  c.fillStyle = K('#35261c'); c.fillRect(-4, -1.2, 4.5, 2.4);
  c.beginPath(); c.moveTo(0, -2.3); c.quadraticCurveTo(8, -4.6, 16.5, -0.6); c.quadraticCurveTo(9, 0.9, 0, 2.2); c.closePath();
  c.fillStyle = K(rage ? '#ffe7b0' : far ? '#a59d92' : '#d2cabe'); c.fill();
  c.strokeStyle = K(rage ? '#ffb32e' : '#ff7a22'); c.lineWidth = 0.9; c.stroke();
  c.restore();
  if (b.act || rage) {
    c.globalCompositeOperation = 'lighter';
    FX.drawGlow(c, rage ? 'gold' : 'orange', bx + dx * 8, by + dy * 8, rage ? 16 : 11, rage ? 0.8 : 0.55);
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  }
}

function drawHero(c, h) {
  const bs = bladeState(h);
  const P = heroPoseOf(h, bs);
  const rage = h.rageT > 0;
  if (h.inv > 0 && h.inv < 0.75 && h.state !== 'dodge' && h.state !== 'finisher' && h.inv < 50 && Math.floor(h.inv * 14) % 2 === 0) c.globalAlpha = 0.55;
  TINT = h.flash > 0 ? '#ffffff' : null;
  c.save();
  c.translate(h.x, h.y);
  c.scale(h.face, 1);
  if (h.state === 'dodge') { c.translate(0, -16); c.rotate((h.t / 0.38) * TAU); c.translate(0, 16); }
  if (h.state === 'air' && h.jumps === 2 && h.vy < 0) { const k = 1 - (-h.vy / HERO.djumpV); c.translate(0, -30); c.rotate(k * TAU); c.translate(0, 30); }
  if (h.state === 'dead') { c.rotate(-Math.min(1, h.t / 0.45) * Math.PI / 2); }
  if (rage) {
    c.globalCompositeOperation = 'lighter';
    FX.drawGlow(c, 'orange', 0, -30, 46 + Math.sin(h.anim * 20) * 4, 0.45);
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  }
  c.lineCap = 'round'; c.lineJoin = 'round';
  // brazo y hoja lejanos
  drawBlade(c, P.sh, P.hL, bs.L, rage, true);
  limb(c, P.sh, P.eL, P.hL, 5.2, 4.8, HC.shade);
  seg(c, mix(P.eL, P.hL, 0.35), P.hL, 5.6, '#5a4026');
  // pierna lejana
  limb(c, P.hip, P.kL, P.fL, 6.2, 5.4, HC.shade);
  seg(c, mix(P.kL, P.fL, 0.25), mix(P.kL, P.fL, 0.85), 6, '#6e5229');
  seg(c, P.fL, { x: P.fL.x + 4, y: P.fL.y }, 3, HC.leather);
  // torso
  const T = torsoPts(P, 14.5, 10.5, 0.5);
  poly(c, [T.nf, T.nb, T.hb, T.hf], HC.skin);
  // músculo pectoral sombreado
  c.strokeStyle = K('rgba(120,110,100,0.5)'); c.lineWidth = 1;
  c.beginPath(); c.moveTo(T.nf.x - T.n.x * 2, T.nf.y + 7); c.quadraticCurveTo(P.neck.x + T.n.x * 6, P.neck.y + 10, P.neck.x, P.neck.y + 9); c.stroke();
  // tatuaje rojo en diagonal
  seg(c, { x: P.neck.x - T.n.x * 4.5, y: P.neck.y - T.n.y * 4.5 + 1 }, { x: P.hip.x + T.n.x * 3.5 + T.u.x * 3, y: P.hip.y + T.n.y * 3.5 + T.u.y * 3 }, 3.2, HC.tattoo);
  // falda y cinturón
  const d = { x: -T.u.x, y: -T.u.y }, fl = h.state === 'run' ? Math.sin(h.runPhase * 2) * 1.5 : 0;
  poly(c, [
    { x: P.hip.x - T.n.x * 6, y: P.hip.y - T.n.y * 6 },
    { x: P.hip.x + T.n.x * 6, y: P.hip.y + T.n.y * 6 },
    { x: P.hip.x + T.n.x * 8 + d.x * 11 + fl, y: P.hip.y + d.y * 11 },
    { x: P.hip.x - T.n.x * 8 + d.x * 12 - fl, y: P.hip.y + d.y * 12 },
  ], HC.skirt);
  seg(c, { x: P.hip.x + T.n.x * 8 + d.x * 11 + fl, y: P.hip.y + d.y * 11 }, { x: P.hip.x - T.n.x * 8 + d.x * 12 - fl, y: P.hip.y + d.y * 12 }, 1.4, HC.gold);
  seg(c, { x: P.hip.x + T.n.x * 2, y: P.hip.y + 1 }, { x: P.hip.x + T.n.x * 3 + d.x * 10, y: P.hip.y + d.y * 10 }, 3, HC.skirtD);
  seg(c, { x: P.hip.x - T.n.x * 6, y: P.hip.y - T.n.y * 6 - 1 }, { x: P.hip.x + T.n.x * 6, y: P.hip.y + T.n.y * 6 - 1 }, 3, HC.leather);
  dot(c, { x: P.hip.x + T.n.x * 5, y: P.hip.y - 1 }, 1.6, HC.gold);
  // pierna cercana
  limb(c, P.hip, P.kR, P.fR, 6.6, 5.6, HC.skin);
  seg(c, mix(P.kR, P.fR, 0.25), mix(P.kR, P.fR, 0.85), 6.2, HC.bronze);
  seg(c, P.fR, { x: P.fR.x + 4.5, y: P.fR.y }, 3, HC.leather);
  // cabeza
  const hd = P.head;
  seg(c, P.neck, hd, 5, HC.skin);
  dot(c, hd, 6.3, HC.skin);
  c.fillStyle = K(HC.beard);
  c.beginPath(); c.moveTo(hd.x + 1, hd.y + 2.2); c.lineTo(hd.x + 6.6, hd.y + 2.6); c.lineTo(hd.x + 5.6, hd.y + 8.4); c.lineTo(hd.x + 2, hd.y + 7.2); c.closePath(); c.fill();
  c.strokeStyle = K(HC.tattoo); c.lineWidth = 2.5;
  c.beginPath(); c.arc(hd.x, hd.y, 5, -0.35, -2.9, true); c.stroke();
  seg(c, { x: hd.x + 4.4, y: hd.y - 3.2 }, { x: hd.x + 3.9, y: hd.y + 2.4 }, 1.8, HC.tattoo);
  c.fillStyle = K(rage ? '#ffcf4a' : '#170c09'); c.fillRect(hd.x + 2.6, hd.y - 1.2, 2.6, 1.4);
  // hombrera
  dot(c, { x: P.sh.x - 1, y: P.sh.y + 0.5 }, 4, '#7f5a2a');
  // brazo y hoja cercanos
  limb(c, P.sh, P.eR, P.hR, 5.6, 5.2, HC.skin);
  seg(c, mix(P.eR, P.hR, 0.35), P.hR, 6, '#6e4f2c');
  dot(c, P.hR, 2.6, HC.skin);
  drawBlade(c, P.sh, P.hR, bs.R, rage, false);
  c.restore();
  TINT = null; c.globalAlpha = 1;
}

/* ---------- Enemigos ---------- */
function enemyGround(c, e) {
  // sombra
  const hgt = Math.max(0, GY - e.y);
  const s = Math.max(0.25, 1 - hgt / 220);
  c.fillStyle = 'rgba(0,0,0,0.35)';
  c.beginPath(); c.ellipse(e.x, GY + 1, e.w * 0.7 * s, 3.2 * s, 0, 0, TAU); c.fill();
}

function drawEnemy(c, e) {
  c.save();
  if (e.state === 'spawn' && !e.T.fly) {
    const p = easeOut(clamp(e.t / e.spawnDur, 0, 1));
    c.beginPath(); c.rect(e.x - 80, -400, 160, GY + 400); c.clip();
    c.translate(0, (1 - p) * e.h * 1.05);
  }
  if (e.state === 'dead' && e.t > 0.8) c.globalAlpha = clamp(1 - (e.t - 0.8) / 0.6, 0, 1);
  TINT = e.flash > 0 ? '#fff4ea' : null;
  c.translate(e.x, e.y);
  c.scale(e.face, 1);
  c.lineCap = 'round'; c.lineJoin = 'round';
  const lying = e.state === 'down' || (e.state === 'dead' && !e.T.fly);
  if (lying) { const p = clamp(e.t / 0.3, 0, 1); c.rotate(-p * Math.PI / 2 * 0.95); }
  if (e.state === 'air') c.rotate(-clamp(e.t * 4, 0, 1) * 0.9);
  if (e.rageT > 0 && e.alive) {
    c.globalCompositeOperation = 'lighter';
    FX.drawGlow(c, 'red', 0, -e.h * 0.55, e.h * 0.75, 0.35 + Math.sin(e.anim * 30) * 0.15);
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  }
  DRAW[e.type](c, e);
  c.restore();
  TINT = null; c.globalAlpha = 1;
  if (e.finishable > 0 && e.alive && e.state !== 'grabbed') drawFinishMark(c, e);
}

function drawFinishMark(c, e) {
  const y = e.y - e.h - 16 - Math.sin(performance.now() / 150) * 2;
  const r = 6.5 + Math.sin(performance.now() / 90) * 0.8;
  c.globalCompositeOperation = 'lighter';
  FX.drawGlow(c, 'red', e.x, y, 16, 0.6);
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  c.strokeStyle = '#ff5544'; c.lineWidth = 2.4;
  c.beginPath(); c.arc(e.x, y, r, 0, TAU); c.stroke();
}

function legionPose(e, S) {
  const o = { aR: 1.2, aL: 1.9, dR: 16, dL: 15, crouch: 0.4, lean: 0.12 };
  const moving = Math.abs(e.vx) > 8 && e.onGround;
  if (moving) { Object.assign(o, walkFeet(e.anim * 9, 8, 5)); o.lean = 0.18; o.aR = 1.1 + Math.sin(e.anim * 9) * 0.4; o.aL = 1.9 - Math.sin(e.anim * 9) * 0.4; }
  switch (e.state) {
    case 'windup': o.aR = -2.4; o.dR = 17; o.lean = -0.12; o.fR = [10, 0]; o.fL = [-7, 0]; break;
    case 'strike': o.aR = 0.5; o.dR = 21; o.lean = 0.3; o.fR = [13, 0]; o.fL = [-8, 0]; break;
    case 'recover': o.aR = 0.9; o.dR = 19; o.lean = 0.2; o.fR = [12, 0]; o.fL = [-8, 0]; break;

function telegraph(c, p, t, red) {
  const k = clamp(t / 0.3, 0, 1);
  c.globalCompositeOperation = 'lighter';
  FX.drawGlow(c, red ? 'red' : 'gold', p.x, p.y, 10 + (1 - k) * 14, 1 - k * 0.6);
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
}

/* ---------- Polifemo ---------- */
function cyclopsPoseOf(e) {
  const S = 3.25;
  const o = { aR: -1.1, aL: 1.2, dR: 15, dL: 15, crouch: 0.3, lean: 0.1, torso: 22, arm: [11, 11] };
  const walking = Math.abs(e.vx) > 5;
  if (walking) { Object.assign(o, walkFeet(e.anim * 4.4, 5, 4, [7, -6])); o.bob = -Math.abs(Math.sin(e.anim * 4.4)) * 1; }
  const p = k => clamp(e.t / k, 0, 1);
  switch (e.state) {
    case 'intro': if (!e.onGround) { o.fR = [6, -6]; o.fL = [-6, -4]; } else if (e.t > 0.5) { o.lean = -0.25; o.headTilt = -0.3; o.aR = -1.9; o.aL = -2.2; } break;
    case 'smashWind': o.aR = lerp(-1.6, -2.6, p(0.9)); o.dR = 17; o.lean = -0.15; o.aL = -2.4; break;
    case 'smash': case 'smashRec': o.aR = 0.75; o.dR = 18; o.aL = 0.9; o.lean = 0.42; o.crouch = 1.6; o.fR = [11, 0]; o.fL = [-8, 0]; break;
    case 'sweepWind': o.aR = lerp(1.4, 2.8, p(0.8)); o.lean = -0.1; o.aL = 0.5; o.fR = [10, 0]; o.fL = [-8, 0]; break;
    case 'sweep': o.aR = lerp(2.8, -0.2, easeOut(p(0.26))); o.dR = 18; o.lean = 0.2; o.fR = [10, 0]; o.fL = [-8, 0]; break;
    case 'sweepRec': o.aR = -0.3; o.dR = 18; o.lean = 0.15; break;
    case 'stompWind': o.fR = [9, -lerp(0, 9, p(0.4))]; o.aR = -0.6; o.aL = -2.6; o.lean = -0.1; break;
    case 'stomp': o.fR = [10, 0]; o.crouch = 0.8; o.aR = -0.4; o.aL = 2.6; o.lean = 0.2; break;
    case 'rockWind': if (e.t < 0.45) { o.aL = 1.1; o.dL = 20; o.lean = 0.5; o.crouch = 1.2; } else { o.aL = -2.2; o.dL = 17; o.lean = -0.2; } break;
    case 'rockRec': o.aL = 0.2; o.dL = 20; o.lean = 0.25; break;
    case 'roar': o.lean = -0.28; o.headTilt = -0.35; o.aR = -1.9; o.aL = -2.4; o.dR = 17; o.dL = 17; break;
    case 'kneel': case 'qte': o.crouch = 2.6; o.lean = 0.42; o.fR = [10, -1]; o.fL = [-9, 0]; o.aR = 1.2; o.aL = 1.5; o.dR = 17; o.headTilt = 0.15; break;
    case 'dying': o.lean = -0.3; o.headTilt = -0.4; o.aR = -2.2; o.aL = 2.4; break;
  }
  return pose(S, o);
}

function drawCyclops(c, e) {
  const P = cyclopsPoseOf(e), S = P.S;
  if (e.state === 'dying') { const k = easeIn(clamp(e.t / 1.6, 0, 1)); c.rotate(-k * Math.PI / 2 * 0.92); }
  const skin = '#8d7b67', dark = '#6a5b4b', belly = '#a08c76';
  // brazo lejano (roca)
  limb(c, P.sh, P.eL, P.hL, 7.4 * S, 6.8 * S, dark);
  dot(c, P.hL, 3.4 * S, dark);
  if (e.state === 'rockWind') {
    c.fillStyle = K('#4a3b30'); c.beginPath(); c.arc(P.hL.x, P.hL.y - 4 * S, 5 * S, 0, TAU); c.fill();
  }
  // grillete con cadena rota
  seg(c, mix(P.eL, P.hL, 0.75), mix(P.eL, P.hL, 0.92), 8 * S, '#3a3532');
  limb(c, P.hip, P.kL, P.fL, 8.4 * S, 7.6 * S, dark);
  // torso
  const T = torsoPts(P, 24, 21, 1.5);
  poly(c, [T.nf, T.nb, T.hb, T.hf], skin);
  c.fillStyle = K(belly);
  c.beginPath(); c.ellipse(lerp(P.neck.x, P.hip.x, 0.62) + T.n.x * 4 * S, lerp(P.neck.y, P.hip.y, 0.62), 9 * S, 8 * S, P.lean, 0, TAU); c.fill();
  c.strokeStyle = K('rgba(60,40,30,0.5)'); c.lineWidth = 1.6;
  c.beginPath(); c.arc(P.neck.x + T.n.x * 3 * S, P.neck.y + 8 * S, 6 * S, 0.3, 2.2); c.stroke();
  // taparrabos
  poly(c, [T.hb, T.hf, { x: T.hf.x + 4 * S, y: T.hf.y + 12 * S }, { x: T.hb.x - 2 * S, y: T.hb.y + 13 * S }], '#3b2a1d');

  c.fillStyle = K('#4a3b30'); c.fillRect(P.fR.x - 3 * S, P.fR.y - 2 * S, 9 * S, 2.4 * S);
  // cabeza
  const hd = P.head;
  seg(c, P.neck, hd, 9 * S, skin);
  dot(c, hd, 9.5 * S, skin);
  c.fillStyle = K('#2c221b');
  c.beginPath(); c.ellipse(hd.x - 4 * S, hd.y - 6 * S, 7 * S, 4 * S, -0.3, 0, TAU); c.fill();
  // cuerno
  c.fillStyle = K('#d8ccb0');
  c.beginPath(); c.moveTo(hd.x - 1 * S, hd.y - 8.5 * S); c.quadraticCurveTo(hd.x + 1 * S, hd.y - 17 * S, hd.x + 6 * S, hd.y - 18 * S); c.quadraticCurveTo(hd.x + 3 * S, hd.y - 12 * S, hd.x + 3.5 * S, hd.y - 7.5 * S); c.closePath(); c.fill();
  // boca
  const roar = e.state === 'roar' || (e.state === 'intro' && e.t > 0.5) || e.state === 'qte';
  c.fillStyle = K('#2a0a08');
  c.beginPath(); c.ellipse(hd.x + 5 * S, hd.y + 5.5 * S, 3.6 * S, (roar ? 2.8 : 1) * S, 0, 0, TAU); c.fill();
  if (roar) { c.fillStyle = K('#e8e0cc'); for (let i = 0; i < 3; i++) c.fillRect(hd.x + (2.5 + i * 2) * S, hd.y + 3.4 * S, 1 * S, 1.2 * S); }
  // el ojo (punto débil)
  const ex = hd.x + 4.2 * S, ey = hd.y - 1 * S;
  if (e.blind) {
    c.fillStyle = K('#5a0606'); c.beginPath(); c.ellipse(ex, ey, 4.4 * S, 3.6 * S, 0, 0, TAU); c.fill();
  } else {
    c.fillStyle = K('#efe6d2'); c.beginPath(); c.ellipse(ex, ey, 4.6 * S, 3.8 * S, 0, 0, TAU); c.fill();
    c.strokeStyle = K('rgba(170,30,20,0.7)'); c.lineWidth = 0.8;
    for (let i = 0; i < 4; i++) { const a = i * 1.6 + 0.4; c.beginPath(); c.moveTo(ex + Math.cos(a) * 4.4 * S, ey + Math.sin(a) * 3.6 * S); c.lineTo(ex + Math.cos(a) * 2.6 * S, ey + Math.sin(a) * 2 * S); c.stroke(); }
    const hx = Game.world ? Game.world.hero.x : e.x, hy = Game.world ? Game.world.hero.y - 30 : GY;
    const lx = clamp(((hx - e.x) * e.face) / 200, -1, 1) * 1.6 * S, ly = clamp((hy - (e.y - 180)) / 200, -1, 1) * 1.2 * S;
    dot(c, { x: ex + lx, y: ey + ly }, 2.4 * S, e.state === 'kneel' || e.state === 'qte' ? '#ffd24a' : '#e09a18');
    dot(c, { x: ex + lx * 1.2, y: ey + ly * 1.2 }, 1.1 * S, '#120804');

    c.beginPath(); c.ellipse(ex, ey, 4.6 * S, 3.8 * S, 0, 0, TAU); c.stroke();
    c.lineWidth = 3; c.beginPath(); c.moveTo(ex - 5 * S, ey - 4.5 * S); c.lineTo(ex + 4 * S, ey - 5.4 * S); c.stroke();
  }
  // brazo cercano con la maza
  limb(c, P.sh, P.eR, P.hR, 8 * S, 7.2 * S, skin);
  dot(c, P.hR, 3.6 * S, skin);
  let ang = Math.atan2(P.hR.y - P.eR.y, P.hR.x - P.eR.x);
  if (e.state === 'idle' || e.state === 'intro' || e.state === 'roar') ang = -2.3;
  c.save(); c.translate(P.hR.x, P.hR.y); c.rotate(ang);
  c.fillStyle = K('#4a3322');
  c.beginPath(); c.moveTo(-6, -3); c.lineTo(84, -9); c.quadraticCurveTo(98, 0, 90, 10); c.lineTo(-6, 4); c.closePath(); c.fill();
  c.fillStyle = K('#c8bfae');
  for (let i = 0; i < 5; i++) { const x = 40 + i * 11; c.beginPath(); c.moveTo(x, -7 - i); c.lineTo(x + 3, -14 - i * 1.2); c.lineTo(x + 6, -7 - i); c.fill(); c.beginPath(); c.moveTo(x + 2, 6 + i * 0.6); c.lineTo(x + 5, 12 + i); c.lineTo(x + 8, 6 + i * 0.6); c.fill(); }
  c.restore();
  if (/Wind/.test(e.state) && e.t < 0.35) telegraph(c, { x: P.hR.x, y: P.hR.y - 20 }, e.t, true);
  if (e.state === 'kneel' || e.state === 'qte') {
    for (let i = 0; i < 4; i++) { const a = e.t * 3 + i * TAU / 4; dot(c, { x: hd.x + Math.cos(a) * 30, y: hd.y - 40 + Math.sin(a) * 6 }, 2.4, '#ffe28a'); }
  }
}

const R = { cv: null, c: null, layers: null, key: '', weather: [], wTheme: '', bolt: 0, boltX: 0, nextBolt: 6 };

const THEMES = {
  costa: { sky: ['#0a121c', '#1c2734', '#4d3530', '#8a4a33'], sun: [0.72, 214, '255,140,80'], weather: 'rain', fog: '30,40,52' },
  templo: { sky: ['#120706', '#3e140d', '#8e3517', '#d6742e'], sun: [0.3, 196, '255,170,90'], weather: 'embers', fog: '90,35,18' },
  volcan: { sky: ['#060303', '#250806', '#6e170a', '#bd3a0f'], sun: [0.5, 240, '255,80,20'], weather: 'ash', fog: '70,14,8' },
};

function initRender(cv) { R.cv = cv; R.c = cv.getContext('2d', { alpha: false }); }
function resizeCanvas() {
  R.cv.width = Math.round(Layout.W * Layout.dpr);
  R.cv.height = Math.round(Layout.H * Layout.dpr);
  R.key = '';
}

function makeLayer(w, h, rs, fn) {
  const cv = document.createElement('canvas');
  const k = Math.min(rs, 4096 / w);
  cv.width = Math.ceil(w * k); cv.height = Math.ceil(h * k);
  const c = cv.getContext('2d');
  c.scale(k, k);
  fn(c, w, h);
  return { cv, w, h };
}
// dibuja algo que puede cruzar el borde del mosaico en ambos lados
const wrapX = (w, x, half, fn) => { fn(x); if (x - half < 0) fn(x + w); if (x + half > w) fn(x - w); };

function glowBlob(c, x, y, r, col, a) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`);
  c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
}

      for (let i = 0; i < 3; i++) {

        c.beginPath(); c.moveTo(x - sw, hz - 2); c.lineTo(x + sw, hz - 2); c.lineTo(x + sw * 0.7, hz + 4); c.lineTo(x - sw * 0.8, hz + 4); c.fill();

    L.midY = 40;
    L.ground = makeLayer(512, 66, rs, (c, w, h) => {
